# =============================================================================
# IFDB Aktivitetstype Routing - Observation Allowlist (Seed)
#
# This file is the repo-controlled source of truth for which IFDB
# AKTIVITETSRESULTAT rows may become FHIR Observation.
#
# Rules:
#   - Only route_status=active routes are approved Observation allowlist entries.
#   - route_status=review means the route is proposed but not yet approved.
#   - route_status=inactive means the route was active but is now disabled.
#   - An aktivitetstype with no approved Observation entry defaults to QR.
#   - target_resource should be "Observation" for curated allowlist rows.
#   - observation_category is only meaningful for Observation routes.
#
# Fields:
#   aktivitetstype_kode   - IFDB AKTIVITETTYPE_KODE value
#   target_resource       - "Observation"
#   observation_category  - FHIR observation-category code (exam, vital-signs, survey, procedure)
#   route_status          - "active", "inactive", or "review"
#   rationale             - Human-readable reason for the routing decision
#   decided_by            - Who made or approved the decision
#   decided_at            - ISO date when the decision was made
#   active_from           - Date from which this route is effective
#   active_to             - Date until which this route is effective (null = open-ended)
# =============================================================================

routes:
