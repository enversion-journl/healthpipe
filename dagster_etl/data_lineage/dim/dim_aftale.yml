dso_lineage:
  Type: dimension
  TableName: dim.Aftale
  Domain: [ERP]
  Description: "Aftale-/kontraktdimension fra ILS — SCD Type 2"
  Grain: "Én række pr. aftale fra ILS"
  SCD: type2

  SourceSystems:
    - ils: [dbo.lafth, dbo.laftd]

  Columns:
    DW_EK_Aftale:       { Type: PK, DataType: INT }
    CleanCode_Aftale:   { DataType: NVARCHAR(255) }
    AftaleNummer:       { DataType: NVARCHAR(100), Source: [ils.dbo.lafth.aftale] }
    AftaleType:         { DataType: NVARCHAR(50), Source: [ils.dbo.lafth.afttype] }
    Aftaletekst:        { DataType: NVARCHAR(MAX), Source: [ils.dbo.lafth.txt] }
    HovedStart:         { DataType: DATETIME2, Source: [ils.dbo.lafth.hoved_start] }
    HovedSlut:          { DataType: DATETIME2, Source: [ils.dbo.lafth.hoved_slut] }
    DW_ValidFrom:       { DataType: DATETIME2(0), Expr: "SYSDATETIME() ved ændring, 1900-01-01 for initial" }
    DW_ValidTo:         { DataType: DATETIME2(0), Expr: "9999-12-31 (åben) indtil afløst" }
    DW_IsDeleted:       { DataType: BIT, Expr: "1 når kilderækken forsvinder (blød sletning)" }
