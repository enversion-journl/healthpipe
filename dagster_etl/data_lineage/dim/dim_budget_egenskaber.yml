dso_lineage:
  Type: dimension
  TableName: dim.BudgetEgenskaber
  Domain: [ERP]
  Description: "Budgetegenskabsdimension — budgetmodel og budgetpost-attributter fra SydAX"
  Grain: "Én række pr. unik kombination af budgetmodel og budgetpost-egenskaber"

  SourceSystems:
    - sydax: [Finans.Budgetpost, Finans.Budgetmodel, Finans.BudgetpostStatus, Finans.BudgetbeløbType, Finans.BudgetmodelType, Finans.OmkostningsstedHierarki]

  Columns:
    DW_EK_BudgetEgenskaber:    { Type: PK, DataType: INT }
    bk_ref_BudgetmodelId:      { DataType: NVARCHAR(100), Source: [sydax.Finans.Budgetmodel.ref_BudgetmodelId] }

    Budgetmodelnummer:    { DataType: NVARCHAR(100), Source: [sydax.Finans.Budgetmodel.Budgetmodelnummer] }
    Budgetmodeltekst:     { DataType: NVARCHAR(255), Source: [sydax.Finans.Budgetmodel.Budgetmodeltekst] }
    Budgetmodeltype:      { DataType: NVARCHAR(255), Source: [sydax.Finans.BudgetmodelType.BudgetmodelTypeTekst] }
    ErLukket:             { DataType: BIT, Source: [sydax.Finans.Budgetmodel.ErLukket] }

    Valutakode:               { DataType: NVARCHAR(10), Source: [sydax.Finans.Budgetpost.Valutakode] }
    DebetKredit:              { DataType: NVARCHAR(20), Source: [sydax.Finans.Budgetpost.DebetKredit] }
    Budgetkode:               { DataType: NVARCHAR(50), Source: [sydax.Finans.Budgetpost.Budgetkode] }
    Aendringstype:            { DataType: NVARCHAR(50), Source: [sydax.Finans.Budgetpost.Ændringstype] }
    AendringstypeBeskrivelse: { DataType: NVARCHAR(255), Source: [sydax.Finans.Budgetpost.ÆndringstypeBeskrivelse] }
    BeloebstypeId:            { DataType: NVARCHAR(50), Source: [sydax.Finans.Budgetpost.BeloebstypeId] }
    BudgetbeloebTypetekst:    { DataType: NVARCHAR(1000), Source: [sydax.Finans.BudgetbeløbType.BudgetbeløbTypetekst] }
    BudgetpostStatusId:       { DataType: NVARCHAR(50), Source: [sydax.Finans.BudgetpostStatus.BudgetpostStatusId] }
    BudgetpostStatusTekst:    { DataType: NVARCHAR(255), Source: [sydax.Finans.BudgetpostStatus.BudgetpostStatustekst] }
    Omkostningsstednummer:    { DataType: NVARCHAR(50), Source: [sydax.Finans.OmkostningsstedHierarki], Expr: "dybeste ikke-null niveau fra hierarki" }
