dso_lineage:
  Type: dimension
  TableName: dim.Faktura
  Domain: [ERP]
  Description: "Fakturametadata-dimension fra MySupply"
  Grain: "Én række pr. faktura-header (CVR + FakturaNr)"

  SourceSystems:
    - mysupply: [dbo.statistic_invoice_header, dbo.metadata, dbo.statistic_invoice_header_allowance_charge]

  Columns:
    DW_EK_Faktura: { Type: PK, DataType: INT }
    FakturaNr:            { DataType: NVARCHAR(100), Source: [mysupply.dbo.statistic_invoice_header.FakturaNr] }
    FakturaValutaKode:    { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_header.FakturaValutaKode] }
    FirmaNavn:            { DataType: NVARCHAR(255), Source: [mysupply.dbo.metadata.FirmaNavn] }
    LeverandorCVR:        { DataType: NVARCHAR(50), Source: [mysupply.dbo.metadata.LeverandorCVR] }
    Adresse:              { DataType: NVARCHAR(255), Source: [mysupply.dbo.metadata.Adresse] }
    ByNavn:               { DataType: NVARCHAR(255), Source: [mysupply.dbo.metadata.By] }
    Postnummer:           { DataType: NVARCHAR(20), Source: [mysupply.dbo.metadata.Postnummer] }
    DokumentType:         { DataType: NVARCHAR(20), Source: [mysupply.dbo.metadata.Type], Expr: "CASE WHEN Type IN ('PIE','PIP','OIOUBL Invoice') THEN 'Faktura' WHEN Type IN ('PCM','PCP','OIOUBL CreditNote') THEN 'Kreditnota' ELSE 'Ukendt' END" }
    RegningsModtagerID:   { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.RegningsModtagerID] }
    RegningsModtagerID_Type: { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.RegningsModtagerID_Type] }
    KøbsOrdreNummer:      { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KøbsOrdreNummer] }
    SalgsOrdreNummer:     { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.SalgsOrdreNummer] }
    KundeIdentification:  { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeIdentification] }
    KundeIdentification_Type: { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeIdentification_Type] }
    DimensionKontoStreng: { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.DimensionKontoStreng] }
    KundeNavn:            { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeNavn] }
    KundeVejNavn:         { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeVejNavn] }
    KundeHusNr:           { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeHusNr] }
    KundeByNavn:          { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeByNavn] }
    KundePostNr:          { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundePostNr] }
    KundeLandeKode:       { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeLandeKode] }
    KundeReferenceID:     { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeReferenceID] }
    KundeReferenceNavn:   { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeReferenceNavn] }
    KundeReferenceTelefonNr: { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_header.KundeReferenceTelefonNr] }
