dso_lineage:
  Type: dimension
  TableName: dim.UNSPSC
  Domain: [ERP]
  Description: "UNSPSC-koder beriget med beskrivelser fra ILS og KMD"
  Grain: "Én række pr. unik UNSPSC-kode"

  SourceSystems:
    - ils:         [dbo.unspsc, dbo.vare]
    - kmd_uddata:  [dimension.UNSPSC]

  Columns:
    DW_EK_UNSPSC:                    { Type: PK, DataType: INT }
    UNSPSC_Kode:                     { DataType: NVARCHAR(50), Source: [ils.dbo.unspsc.unspsc, ils.dbo.vare.unspc, ils.dbo.vare.unspsc2, kmd_uddata.dimension.UNSPSC.UNSPSCClassID], Expr: "rå UNSPSC-kode (.0-suffiks fjernet på vare.unspsc2)" }
    Source_ILS:                      { DataType: BIT, Expr: "1 hvis koden er observeret i ILS, ellers 0 (sticky 1 efter første ILS-observation)" }
    Source_KMD:                      { DataType: BIT, Expr: "1 hvis koden er observeret i KMD, ellers 0 (sticky 1 efter første KMD-observation)" }
    Beskrivelse_ILS:                 { DataType: NVARCHAR(255), Source: [ils.dbo.unspsc.betegn] }
    Beskrivelse_engelsk_ILS:         { DataType: NVARCHAR(255), Source: [ils.dbo.unspsc.un_name] }
    Beskrivelse_KMD:                 { DataType: NVARCHAR(400), Source: [kmd_uddata.dimension.UNSPSC.UNSPSCClassDescription], Expr: "kun rækker hvor DW_IsCurrent = 1" }
    UNSPSC_Level_KMD:                { DataType: SMALLINT,      Source: [kmd_uddata.dimension.UNSPSC.UNSPSCLevel] }
    UNSPSC_Level_1_Kode_KMD:         { DataType: NVARCHAR(50),  Source: [kmd_uddata.dimension.UNSPSC.UNSPSCClassLev1ID] }
    UNSPSC_Level_1_Beskrivelse_KMD:  { DataType: NVARCHAR(400), Source: [kmd_uddata.dimension.UNSPSC.UNSPSCClassLev1Description] }
    UNSPSC_Level_2_Kode_KMD:         { DataType: NVARCHAR(50),  Source: [kmd_uddata.dimension.UNSPSC.UNSPSCClassLev2ID] }
    UNSPSC_Level_2_Beskrivelse_KMD:  { DataType: NVARCHAR(400), Source: [kmd_uddata.dimension.UNSPSC.UNSPSCClassLev2Description] }
    UNSPSC_Level_3_Kode_KMD:         { DataType: NVARCHAR(50),  Source: [kmd_uddata.dimension.UNSPSC.UNSPSCClassLev3ID] }
    UNSPSC_Level_3_Beskrivelse_KMD:  { DataType: NVARCHAR(400), Source: [kmd_uddata.dimension.UNSPSC.UNSPSCClassLev3Description] }
    UNSPSC_Level_4_Kode_KMD:         { DataType: NVARCHAR(50),  Source: [kmd_uddata.dimension.UNSPSC.UNSPSCClassLev4ID] }
    UNSPSC_Level_4_Beskrivelse_KMD:  { DataType: NVARCHAR(400), Source: [kmd_uddata.dimension.UNSPSC.UNSPSCClassLev4Description] }
    DW_Timestamp_Insert:             { DataType: DATETIME2 }
    DW_Timestamp_Update:             { DataType: DATETIME2 }
