dso_lineage:
  Type: dimension
  TableName: dim.IlsVare
  Domain: [ERP]
  Description: "ILS varedimension med varestamdata fra ILS"
  Grain: "Én række pr. ILS-vare"

  SourceSystems:
    - ils: [dbo.vare, dbo.vareart, dbo.varegrp, dbo.varetype, dbo.momskd, dbo.zz_oper]

  Columns:
    DW_EK_IlsVare:        { Type: PK, DataType: INT }
    CleanCode_IlsVare:    { DataType: NVARCHAR(100) }
    Varenummer:            { DataType: NVARCHAR(100), Source: [ils.dbo.vare.vnr] }
    Varenavn:              { DataType: NVARCHAR(MAX), Source: [ils.dbo.vare.navn] }
    Varenavn2:             { DataType: NVARCHAR(MAX), Source: [ils.dbo.vare.navn2] }
    Varestr:               { DataType: NVARCHAR(255), Source: [ils.dbo.vare.varestr] }
    Basisenhed:            { DataType: NVARCHAR(50), Source: [ils.dbo.vare.basisenh] }
    Gruppering:            { DataType: NVARCHAR(50), Source: [ils.dbo.vare.vareart], Description: "ILS vareart = SydAX gruppering (art/gruppering byttet om i ILS)" }
    Gruppering_Navn:       { DataType: NVARCHAR(255), Source: [ils.dbo.vareart.navn] }
    Art:                   { DataType: NVARCHAR(50), Source: [ils.dbo.vare.varegrp], Description: "ILS varegrp = SydAX art (byttet om i ILS)" }
    Art_Navn:              { DataType: NVARCHAR(255), Source: [ils.dbo.varegrp.navn] }
    Varetype:              { DataType: NVARCHAR(50), Source: [ils.dbo.vare.varetype] }
    Varetype_Navn:         { DataType: NVARCHAR(255), Source: [ils.dbo.varetype.navn] }
    Momskode:              { DataType: NVARCHAR(50), Source: [ils.dbo.vare.momskd] }
    Momskode_Navn:         { DataType: NVARCHAR(255), Source: [ils.dbo.momskd.navn] }
    Momsprocent:           { DataType: DECIMAL(18,4), Source: [ils.dbo.momskd.procent] }
    DW_EK_Dato_Oprettet:  { Type: FK, DataType: INT, Source: [ils.dbo.vare.opretdto] }
    Datotid_Oprettet:      { DataType: DATETIME2, Source: [ils.dbo.vare.opretdto] }
    DW_EK_UNSPSC:
      Type: FK
      DataType: INT
      Description: "FK til dim.UNSPSC via map.UNSPSC (kilde: ils.dbo.vare.unspc)"
    DW_EK_UNSPSC_Intern:
      Type: FK
      DataType: INT
      Description: "FK til dim.UNSPSC via map.UNSPSC (kilde: ils.dbo.vare.unspsc2, '.0'-suffiks trimmet)"
    FaellesVarenummer:     { DataType: NVARCHAR(100), Source: [ils.dbo.vare.faelvnr] }
    EAN_Varenummer:        { DataType: NVARCHAR(100), Source: [ils.dbo.vare.ean_vnr] }
    Billede:               { DataType: NVARCHAR(MAX), Source: [ils.dbo.vare.billed] }
    OprBruger:             { DataType: NVARCHAR(50), Source: [ils.dbo.vare.oprbruger], Description: "UPPER af init" }
    OprBruger_Navn:        { DataType: NVARCHAR(255), Source: [ils.dbo.zz_oper.bd_navn], Description: "Fuldt navn via join zz_oper.bd_init = vare.oprbruger" }
    Weblink:               { DataType: NVARCHAR(MAX), Source: [ils.dbo.vare.billedli] }
    MaaIkkeLukkes:         { DataType: NVARCHAR(50), Source: [ils.dbo.vare.ejlukkes] }
    Hygiejne:              { DataType: NVARCHAR(50), Source: [ils.dbo.vare.steril] }
    Aktiv:                 { DataType: BIT, Source: [ils.dbo.vare.aktiv] }
