dso_lineage:
  Type: dimension
  TableName: dim.Vare
  Domain: [ERP]
  Description: "Vare-/produktdimension konsolideret fra MySupply, ILS og ILS-aftaler"
  Grain: "Én række pr. vare/produkt"
  Privacy: >
    dim.Vare bruger KUN MySupply/ILS-kilder.
    KMD ItemDescription/ItemName indeholder potentielt personfølsomt fritekst
    og må ALDRIG indgå i denne dimension.
    Fakturalinje-fritekst fra MySupply persisteres i Varenavn/VarenavnKort, og
    VarenummerKreditor kan være CPR-formateret. Disse felter kan derfor indeholde
    personfølsomme oplysninger (navne/CPR). Adgang styres kolonnebegrænset i
    vw_dim.Vare: felterne maskeres ([MASKERET]) medmindre brugeren er tildelt
    sec.BrugerRoller.Fritekst (adgang skal anmodes, evt. med 2-faktor). Rene
    varenavne hentes via dim.IlsVare (FK DW_EK_IlsVare) / vw_dim.IlsVare.

  SourceSystems:
    - mysupply: [dbo.statistic_invoice_line]
    - ils: [dbo.vare, dbo.vareart, dbo.varegrp]
    - ils_aftaler: [dbo.lafth, dbo.laftd, dbo.laftdpris, dbo.laftdstam]

  Columns:
    DW_EK_Vare:              { Type: PK, DataType: INT }
    CVR:                     { DataType: NVARCHAR(255) }
    VarenummerKreditor:      { DataType: NVARCHAR(255) }
    Varenavn:                { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_line.Item_FakturaUdstederVareNavn, ils.dbo.vare.navn] }
    VarenavnKort:            { DataType: NVARCHAR(MAX), Source: [mysupply.dbo.statistic_invoice_line.Item_FakturaUdstederVareNavn] }
    Maerke:                  { DataType: NVARCHAR(255), Source: [ils.dbo.laftd.maerke] }
    ILS_Varenummer:          { DataType: NVARCHAR(100), Source: [ils.dbo.vare.vnr] }
    FaellesVarenummer:       { DataType: NVARCHAR(100), Source: [ils.dbo.vare.faelvnr] }
    Stregkode:               { DataType: NVARCHAR(50), Source: [ils.dbo.vare.ean_vnr] }
    StoerrelseTekst:         { DataType: NVARCHAR(255), Source: [ils.dbo.vare.varestr] }
    SammensatNavn:           { DataType: NVARCHAR(255), Source: [ils.dbo.vare.navn_conc] }
    Basisenhed:              { DataType: NVARCHAR(50), Source: [ils.dbo.vare.basisenh] }
    Pakkestoerrelse1:        { DataType: DECIMAL(18,4), Source: [ils.dbo.laftdpris.pakstr1] }
    Pakkestoerrelse2:        { DataType: DECIMAL(18,4), Source: [ils.dbo.laftdpris.pakstr2] }
    Pakkestoerrelse3:        { DataType: DECIMAL(18,4), Source: [ils.dbo.laftdpris.pakstr3] }
    VareartKode:             { DataType: NVARCHAR(50), Source: [ils.dbo.vare.vareart] }
    VareartNavn:             { DataType: NVARCHAR(255), Source: [ils.dbo.vareart.navn] }
    VaregruppeKode:          { DataType: NVARCHAR(50), Source: [ils.dbo.vare.varegrp] }
    VaregruppeNavn:          { DataType: NVARCHAR(255), Source: [ils.dbo.varegrp.navn] }
    Varetype:                { DataType: NVARCHAR(50), Source: [ils.dbo.vare.varetype] }
    Aftale:                  { DataType: NVARCHAR(100), Source: [ils.dbo.lafth.aftale] }
    AftaleType:              { DataType: NVARCHAR(50), Source: [ils.dbo.lafth.afttype] }
    Aftaletekst:             { DataType: NVARCHAR(MAX), Source: [ils.dbo.lafth.txt] }
    Kreditorvarenummer1:     { DataType: NVARCHAR(100), Source: [ils.dbo.laftdstam.lvnr1] }
    Kreditorvarenummer2:     { DataType: NVARCHAR(100), Source: [ils.dbo.laftdstam.lvnr2] }
    Kreditorvarenummer3:     { DataType: NVARCHAR(100), Source: [ils.dbo.laftdstam.lvnr3] }
    Pris1:                   { DataType: DECIMAL(18,4), Source: [ils.dbo.laftdpris.pris1] }
    Pris2:                   { DataType: DECIMAL(18,4), Source: [ils.dbo.laftdpris.pris2] }
    Pris3:                   { DataType: DECIMAL(18,4), Source: [ils.dbo.laftdpris.pris3] }
    ils_dsa_aftale_varenummer: { DataType: NVARCHAR(100), Source: [ils.dbo.laftd.vnr] }
    Kreditornummer:          { DataType: NVARCHAR(50), Source: [ils.dbo.laftd.lnr, ils.dbo.lafth.lnr] }
    momskd:                  { DataType: NVARCHAR(50), Source: [ils.dbo.vare.momskd] }
    afgiftkd:                { DataType: NVARCHAR(50), Source: [ils.dbo.vare.afgiftkd] }
    DW_EK_Aftale:            { Type: FK, DataType: INT, Source: [ils.dbo.lafth.aftale] }
    DW_EK_IlsVare:           { Type: FK, DataType: INT, Source: [ils.dbo.vare.vnr] }
