dso_lineage:
  Type: fhir
  TableName: fhir.Encounter
  Domain: [FHIR]
  Description: "FHIR Encounter ressource — kliniske kontakter fra IFDB"
  Grain: "Én række pr. klinisk kontakt (besøg)"
  FhirResource: Encounter

  SourceSystems:
    - ifdb: [IFDB.ENCOUNTER]

  Columns:
    encounter_id:       { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", Source: [ifdb.IFDB.ENCOUNTER.OBJECT_ID] }
    patient_id:         { DataType: NVARCHAR(255), FhirPath: "subject.id", Source: [ifdb.IFDB.ENCOUNTER.PATIENT_ID] }
    episode_of_care_id: { DataType: NVARCHAR(255), FhirPath: "episodeOfCare.id", Source: [ifdb.IFDB.ENCOUNTER.EPISODE_OF_CARE_ID] }
    service_provider_id: { DataType: NVARCHAR(255), FhirPath: "serviceProvider.id", Source: [ifdb.IFDB.ENCOUNTER.SERVICE_PROVIDER_SORCODE] }
    identifier_value:   { DataType: NVARCHAR(255), FhirPath: "identifier.value", Source: [ifdb.IFDB.ENCOUNTER.OBJECT_ID] }
    status:             { DataType: NVARCHAR(50), FhirPath: "status", Source: [ifdb.IFDB.ENCOUNTER.STATUS_TEXT] }
    class_code:         { DataType: NVARCHAR(100), FhirPath: "class.code", Source: [ifdb.IFDB.ENCOUNTER.CLASS_CODE] }
    class_display:      { DataType: NVARCHAR(255), FhirPath: "class.display", Source: [ifdb.IFDB.ENCOUNTER.CLASS_TEXT] }
    period_start:       { DataType: NVARCHAR(50), FhirPath: "period.start", Source: [ifdb.IFDB.ENCOUNTER.PERIOD_START] }
    period_end:         { DataType: NVARCHAR(50), FhirPath: "period.end", Source: [ifdb.IFDB.ENCOUNTER.PERIOD_END] }
    last_updated:       { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:         { DataType: DATETIME2, FhirPath: "r.cts" }
