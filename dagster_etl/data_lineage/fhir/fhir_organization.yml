dso_lineage:
  Type: fhir
  TableName: fhir.Organization
  Domain: [FHIR]
  Description: "FHIR Organization ressource — organisatoriske enheder (kun SOR-kilde)"
  Grain: "Én række pr. organisatorisk enhed"
  FhirResource: Organization

  SourceSystems:
    - sor: [SOR_registry]

  Columns:
    organization_id:    { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", Description: "FHIR resource id (FHIR-server), servertildelt GUID — kanonisk organisations-identitet. Findes ikke i kilden; mappes til INT-surrogatet DW_EK_Organisation via ref.Organisation." }
    name:               { DataType: NVARCHAR(500), FhirPath: "name", Source: [sor.SOR_registry.EntityName] }
    active:             { DataType: NVARCHAR(10), FhirPath: "active", Source: [sor.SOR_registry.Status] }
    type_code:          { DataType: NVARCHAR(255), FhirPath: "type.coding.code.first()" }
    type_display:       { DataType: NVARCHAR(500), FhirPath: "type.coding.display.first()" }
    part_of_id:         { DataType: NVARCHAR(255), FhirPath: "partOf.id", Description: "Forælderens FHIR resource id (servertildelt GUID), sat ved posting ud fra forælderens SOR-kode (ParentSorId). Findes ikke direkte i kilden." }
    identifier_value_sor: { DataType: NVARCHAR(255), FhirPath: "identifier.where(system='https://sundhedsdatastyrelsen.dk/sor').value.first()", Source: [sor.SOR_registry.SORId] }
    last_updated:       { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:         { DataType: DATETIME2, FhirPath: "r.cts" }
