dso_lineage:
  Type: fhir
  TableName: fhir.Procedure
  Domain: [FHIR]
  Description: "FHIR Procedure ressource — kliniske og administrative procedurer"
  Grain: "Én række pr. procedure fra administrative procedurer eller RIS-ydelser"
  FhirResource: Procedure

  SourceSystems:
    - ifdb_administrative_procedure: [IFDB.ADMINISTRATIVE_PROCEDURE]
    - ifdb_ris_ydelse: [IFDB.RIS_YDELSE]
    - ifdb_adm_procedure_suppl_codes: [IFDB.ADM_PROCEDURE_SUPPL_CODES]

  Columns:
    procedure_id:           { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.OBJECT_ID, ifdb_ris_ydelse.IFDB.RIS_YDELSE.OBJEKT_ID] }
    patient_id:             { DataType: NVARCHAR(255), FhirPath: "subject.id", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PATIENT_ID, ifdb_ris_ydelse.IFDB.RIS_YDELSE.PATIENT_ID] }
    encounter_id:           { DataType: NVARCHAR(255), FhirPath: "encounter.id", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.ENCOUNTER_ID, ifdb_ris_ydelse.IFDB.RIS_YDELSE.ENCOUNTER_ID] }
    episode_of_care_id:     { DataType: NVARCHAR(255), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/episodeOfCare').valueReference.id", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.EPISODE_OF_CARE_ID, ifdb_ris_ydelse.IFDB.RIS_YDELSE.EPISODE_OF_CARE_ID] }
    status:                 { DataType: NVARCHAR(50), FhirPath: "status" }
    is_deleted:             { DataType: INT, FhirPath: "extension.where(url='urn:fhir:isDeleted').valueInteger", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.DELETED, ifdb_ris_ydelse.IFDB.RIS_YDELSE.SLETTET] }
    category_code:          { DataType: NVARCHAR(255), FhirPath: "category.coding.code", Source: [ifdb_ris_ydelse.IFDB.RIS_YDELSE.TYPE] }
    category_display:       { DataType: NVARCHAR(500), FhirPath: "category.coding.display", Source: [ifdb_ris_ydelse.IFDB.RIS_YDELSE.STATE] }
    code:                   { DataType: NVARCHAR(255), FhirPath: "code.coding.code", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PROCEDURE_CODE, ifdb_ris_ydelse.IFDB.RIS_YDELSE.TYPE, ifdb_adm_procedure_suppl_codes.IFDB.ADM_PROCEDURE_SUPPL_CODES.SUPPL_CODE] }
    code_system:            { DataType: NVARCHAR(500), FhirPath: "code.coding.system" }
    code_display:           { DataType: NVARCHAR(500), FhirPath: "code.coding.display", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PROCEDURE_TEXT, ifdb_ris_ydelse.IFDB.RIS_YDELSE.STATE] }
    performed_datetime:     { DataType: NVARCHAR(50), FhirPath: "performedDateTime", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PERIOD_START, ifdb_ris_ydelse.IFDB.RIS_YDELSE.UDFOERT_TIDSPUNKT] }
    performed_period_start: { DataType: NVARCHAR(50), FhirPath: "performedPeriod.start" }
    performed_period_end:   { DataType: NVARCHAR(50), FhirPath: "performedPeriod.end" }
    body_site_code:         { DataType: NVARCHAR(255), FhirPath: "bodySite.coding.code" }
    body_site_display:      { DataType: NVARCHAR(500), FhirPath: "bodySite.coding.display" }
    source_system:          { DataType: NVARCHAR(100), FhirPath: "identifier.system" }
    last_updated:           { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:             { DataType: DATETIME2, FhirPath: "r.cts" }
