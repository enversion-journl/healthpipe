dso_lineage:
  Type: fact
  TableName: fct.Faktura
  Domain: [ERP]
  Description: "Fakturahoved fact tabel — én række pr. faktura fra MySupply"
  Grain: "Én række pr. faktura, identificeret ved metadata + header-ID fra MySupply"

  SourceSystems:
    - mysupply: [dbo.statistic_invoice_header, dbo.statistic_invoice_line, dbo.metadata, dbo.statistic_invoice_header_allowance_charge]

  Columns:
    DW_EK_Faktura:      { Type: PK, DataType: INT, FK-Target: dim.Faktura }

    DW_EK_Kreditor:     { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.FakturaUdstederCVRNummer, mysupply.dbo.metadata.LeverandorCVR] }
    DW_EK_EAN_Regningsmodtager: { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.RegningsModtagerID] }

    DW_EK_Dato_Faktura:   { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.FakturaDato] }
    DW_EK_Dato_Ordre:     { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.OrdreDato] }
    DW_EK_Dato_Betaling:  { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.BetalingsDato] }

    FakturaNr:          { DataType: NVARCHAR(100), Source: [mysupply.dbo.statistic_invoice_header.FakturaNr] }

    MomsProcent:        { Type: Measure, DataType: DECIMAL(9,4), Source: [mysupply.dbo.statistic_invoice_header.VAT_AfgiftsKategoriProcent] }
    MomsGrundlag:       { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_header.VAT_CategoryTotal_AfgiftsKategoriMomsGrundlag] }
    MomsBeloeb:         { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_header.VAT_TaxAmounts_AfgiftsKategoriMomsBeloeb] }

    LinjeTotal:         { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_header.FakturaLinjeTotal] }
    FakturaTotal:       { Type: Measure, DataType: DECIMAL(18,4), Expr: "COALESCE(mysupply.dbo.statistic_invoice_header.FakturaTotal, mysupply.dbo.metadata.FakturaTotal)" }

    Valutakode_Faktura:      { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_header.FakturaValutaKode] }
    VAT_AfgiftsKategori:     { DataType: NVARCHAR(50), Source: [mysupply.dbo.statistic_invoice_header.VAT_AfgiftsKategori] }
    Valutakode_MomsGrundlag: { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_header.VAT_TaxAmounts_AfgiftsKategoriMomsGrundlag_Valuta], Expr: "LEFT(...,3) hvis ikke-numerisk, ellers NULL" }
    Valutakode_MomsBeloeb:   { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_header.VAT_TaxAmounts_AfgiftsKategoriMomsBeloeb_Valuta], Expr: "LEFT(...,3) hvis ikke-numerisk, ellers NULL" }
    Valutakode_LinjeTotal:   { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_header.FakturaLinjeTotal_Valuta], Expr: "LEFT(...,3) hvis ikke-numerisk, ellers NULL" }
    Valutakode_FakturaTotal: { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_header.FakturaTotal_Valuta], Expr: "LEFT(...,3) hvis ikke-numerisk, ellers NULL" }

    ZeroRated_MomsGrundlag:  { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_header.ZERO-RATED_TaxAmounts_AfgiftsKategoriMomsGrundlag] }
    Valutakode_ZeroRated_MomsGrundlag: { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_header.ZERO-RATED_TaxAmounts_AfgiftsKategoriMomsGrundlag_Valuta], Expr: "LEFT(...,3) hvis ikke-numerisk, ellers NULL" }
    ZeroRated_MomsBeloeb:    { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_header.ZERO-RATED_TaxAmounts_AfgiftsKategoriMomsBeloeb] }
    Valutakode_ZeroRated_MomsBeloeb: { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_header.ZERO-RATED_TaxAmounts_AfgiftsKategoriMomsBeloeb_Valuta], Expr: "LEFT(...,3) hvis ikke-numerisk, ellers NULL" }

    GebyrBeloeb: { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_header_allowance_charge.GebyrKategoriTotal], Expr: "SUM af gebyrer pr. faktura (GebyrKategoriIndikering <> 'false'); 0 hvis fakturaen ingen gebyr-rækker har; detaljer ligger '#'-konkateneret på dim.Faktura. FORTEGN: gemt verbatim fra kilden, ingen fortegnsnormalisering (i praksis positiv magnitude) — LÆGGES TIL i totaler." }
    RabatBeloeb: { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_header_allowance_charge.GebyrKategoriTotal], Expr: "SUM af rabatter pr. faktura (GebyrKategoriIndikering = 'false'); 0 hvis fakturaen ingen gebyr-rækker har; detaljer ligger '#'-konkateneret på dim.Faktura. FORTEGN: gemt verbatim fra kilden, ingen fortegnsnormalisering (i praksis positiv magnitude) — TRÆKKES FRA i totaler. Rapport-total = grundbeløb + GebyrBeloeb − RabatBeloeb." }

    DW_Timestamp_Insert: { Type: Audit, DataType: DATETIME2(0), Expr: "SYSDATETIME() ved første INSERT" }
    DW_Timestamp_Update: { Type: Audit, DataType: DATETIME2(0), Expr: "SYSDATETIME() ved UPDATE (NULL indtil første opdatering)" }
  Notes:
    - "SOR organisation for reporting: vw_fct.Faktura.DW_EK_Organisation_Regningsmodtager (conceptmap.EANToSOR via DW_EK_EAN_Regningsmodtager). fct.Faktura has no DW_EK_Organisation column."
    - "Header-niveau measures fra fct.Fakturalinje er konsolideret her: VAT_AfgiftsKategori, Valutakode_Moms*, Valutakode_LinjeTotal, Valutakode_FakturaTotal, ZeroRated_MomsGrundlag/MomsBeloeb."
    - "Kontoplan/Postering (finding 2.2): fct.Faktura lagrer INGEN DW_EK_Kontoplan eller DW_EK_Postering — ingen fact-to-fact FK. vw_fct.Faktura eksponerer DW_EK_Kontoplan_Postering og DW_EK_Postering fra den NYESTE relaterede postering via ref.Faktura_To_Postering (join på DW_EK_Faktura, rn_newest_per_faktura=1). Disse er single-valued (nyeste postering) og kun beskrivende; for konto-vægtede beløb skal man aggregere fct.Postering på DW_EK_Kontoplan (kontoen ligger på postering-grain)."
