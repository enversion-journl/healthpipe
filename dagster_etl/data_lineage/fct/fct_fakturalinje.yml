dso_lineage:
  Type: fact
  TableName: fct.Fakturalinje
  Domain: [ERP]
  Description: "Fakturalinje fact tabel — én række pr. fakturalinje fra MySupply, beriget med UNSPSC via KMD SpendAnalysisLines-match (Option 2)"
  Grain: "Én række pr. fakturalinje, identificeret ved metadata + header + linje sammensat nøgle"

  SourceSystems:
    - mysupply: [dbo.statistic_invoice_header, dbo.statistic_invoice_line, dbo.metadata, dbo.statistic_invoice_line_allowance_charge]
    - kmd_uddata: [fact.SpendAnalysisLines, dimension.UNSPSC, dimension.Invoice]

  Columns:
    DW_EK_Fakturalinje: { Type: PK, DataType: INT, FK-Target: dim.Fakturalinje }
    CleanCode_Fakturalinje: { DataType: NVARCHAR(500), Expr: "FakturaMetadata_CleanCode + '_' + FakturaHeader_CleanCode + '_' + COALESCE(FakturaLines_CleanCode, 'NULL')" }
    bk_FakturaLines:        { DataType: NVARCHAR(500), Source: [mysupply.dbo.statistic_invoice_line.id], Expr: "CAST(id AS NVARCHAR(500))" }
    bk_FakturaHeader:       { DataType: NVARCHAR(500), Source: [mysupply.dbo.statistic_invoice_header.id], Expr: "CAST(id AS NVARCHAR(500))" }
    bk_FakturaMetadata:     { DataType: NVARCHAR(500), Source: [mysupply.dbo.metadata.id], Expr: "CAST(id AS NVARCHAR(500))" }

    DW_EK_Kreditor:     { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.FakturaUdstederCVRNummer, mysupply.dbo.metadata.LeverandorCVR] }
    DW_EK_Vare:         { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.FakturaUdstederCVRNummer, mysupply.dbo.statistic_invoice_line.Item_FakturaUdstederVareNr] }
    DW_EK_Faktura:      { Type: FK, DataType: INT, FK-Target: dim.Faktura, Source: [mysupply.dbo.metadata.id, mysupply.dbo.statistic_invoice_header.id] }
    DW_EK_EAN_Regningsmodtager: { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.RegningsModtagerID] }

    DW_EK_UNSPSC:       {Type: FK, DataType: INT, FK-Target: dim.UNSPSC, Source: [kmd_uddata.fact.SpendAnalysisLines, dimension.UNSPSC], Expr: "COALESCE(kmd1/kmd2/kmd3.DW_EK_UNSPSC, -1) via stg.kmd_fakturalinje_unspsc_match: tier1=CVR+FAKTURA+linjebeløb+antal+enhedspris; tier2=uden enhedspris; tier3=metadata.FakturaTotal (header fallback) når linjemål NULL og én KMD UNSPSC. CleanCode_Kreditor fra metadata.LeverandorCVR.", Description: "KMD Option 2: pre-computed staging lookup med CleanCode_Kreditor/CleanCode_Faktura og lagdelt match." }

    DW_EK_Dato_Faktura:     { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.FakturaDato] }
    DW_EK_Dato_Ordre:       { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.OrdreDato] }
    DW_EK_Dato_Betaling:    { Type: FK, DataType: INT, Source: [mysupply.dbo.statistic_invoice_header.BetalingsDato] }
    DW_EK_Dato_Modtagelse:  { Type: FK, DataType: INT, Expr: "hardcoded -1 (UKENDT)" }

    FakturaNr:              { DataType: NVARCHAR(100), Source: [mysupply.dbo.statistic_invoice_header.FakturaNr] }
    AntalEnhederFaktureret: { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_line.AntalEnhederFaktureret] }
    LinjeBeloeb:            { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_line.LinjeBeloeb] }
    EnhedsPris:             { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_line.BasePrice_EnhedsPris] }

    Valutakode_Linje:      { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_line.LinjeBeloeb_Valuta] }
    Valutakode_Enhedspris: { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_line.BasePrice_EnhedsPris_Valuta] }
    Valutakode_Faktura:    { DataType: NVARCHAR(10), Source: [mysupply.dbo.statistic_invoice_header.FakturaValutaKode] }

    GebyrBeloeb: { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_line_allowance_charge.FakturaUdstederGebyrKategoriTotal], Expr: "SUM af gebyrer pr. linje (FakturaUdstederGebyrKategoriIndikering <> 'false'); 0 hvis linjen ingen gebyr-rækker har; detaljer ligger '#'-konkateneret på dim.Fakturalinje. FORTEGN: gemt verbatim fra kilden, ingen fortegnsnormalisering (i praksis positiv magnitude) — LÆGGES TIL i totaler." }
    RabatBeloeb: { Type: Measure, DataType: DECIMAL(18,4), Source: [mysupply.dbo.statistic_invoice_line_allowance_charge.FakturaUdstederGebyrKategoriTotal], Expr: "SUM af rabatter pr. linje (FakturaUdstederGebyrKategoriIndikering = 'false'); 0 hvis linjen ingen gebyr-rækker har; detaljer ligger '#'-konkateneret på dim.Fakturalinje. FORTEGN: gemt verbatim fra kilden, ingen fortegnsnormalisering (i praksis positiv magnitude) — TRÆKKES FRA i totaler. Rapport-total = grundbeløb + GebyrBeloeb − RabatBeloeb." }

    DW_Timestamp_Insert: { Type: Audit, DataType: DATETIME2(0), Expr: "SYSDATETIME() ved første INSERT" }
    DW_Timestamp_Update: { Type: Audit, DataType: DATETIME2(0), Expr: "SYSDATETIME() ved UPDATE (NULL indtil første opdatering)" }
