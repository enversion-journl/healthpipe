dso_lineage:
  Type: fact
  TableName: fct.Vareudlevering
  Domain: [ERP]
  Description: "Centrallager udlevering fact tabel — én række pr. udleveringslinje fra ILS"
  Grain: "Én række pr. udleveringslinje fra ILS centrallager"

  SourceSystems:
    - ils_udlev: [dbo.udlev]
    - lager_codesystem: [codesystem.LagerConcept]

  Columns:
    DW_EK_Vareudlevering: { Type: PK, DataType: INT }
    CleanCode_Vareudlevering: { DataType: NVARCHAR(500), Expr: "UDLEV_{prrowid}" }
    bk_prrowid:           { DataType: NVARCHAR(100), Source: [ils_udlev.dbo.udlev.prrowid] }

    DW_EK_IlsVare:                  { Type: FK, DataType: INT, Source: [ils_udlev.dbo.udlev.vnr] }
    DW_EK_UNSPSC:
      Type: FK
      DataType: INT
      FK-Target: dim.UNSPSC
      Source: [ils.dbo.vare.unspc, ils.dbo.vare.unspsc2]
      Expr: >
        COALESCE((
          SELECT um.DW_EK_UNSPSC
          FROM [dim].[IlsVare] di
          INNER JOIN [map].[UNSPSC] um
            ON um.CleanCode_UNSPSC = COALESCE(
              NULLIF(LTRIM(RTRIM(di.UNSPSC)), ''),
              CASE
                WHEN di.UNSPSC_Intern LIKE '%.0'
                THEN LEFT(
                  LTRIM(RTRIM(di.UNSPSC_Intern)),
                  LEN(LTRIM(RTRIM(di.UNSPSC_Intern))) - 2
                )
                ELSE NULLIF(LTRIM(RTRIM(di.UNSPSC_Intern)), '')
              END
            )
          WHERE di.DW_EK_IlsVare = f.DW_EK_IlsVare
        ), -1)
      Description: >
        Direkte FK på fact via map.UNSPSC; CleanCode fra dim.IlsVare UNSPSC/UNSPSC_Intern
        (unspc prioriteres over unspsc2 med '.0'-strip). Ikke via dim.IlsVare.DW_EK_UNSPSC.
    DW_EK_Lager:                    { Type: FK, DataType: BIGINT, Source: [ils_udlev.dbo.udlev.sgh, ils_udlev.dbo.udlev.lgr] }
    DW_EK_Rekvirent:                { Type: FK, DataType: INT, Source: [ils_udlev.dbo.udlev.sgh, ils_udlev.dbo.udlev.rnr] }
    DW_EK_Vare:                     { Type: FK, DataType: BIGINT, Source: [ils_udlev.dbo.udlev.lnr, ils_udlev.dbo.udlev.lvnr_1] }
    DW_EK_VareudleveringEgenskaber: { Type: FK, DataType: INT, Source: [ils_udlev.dbo.udlev.prrowid] }

    DW_EK_Dato_Vareudlevering: { Type: FK, DataType: INT, Source: [ils_udlev.dbo.udlev.udldto] }
    DW_EK_Dato_Udloeb:     { Type: FK, DataType: INT, Source: [ils_udlev.dbo.udlev.udlobdto] }
    DW_EK_Dato_Postering:  { Type: FK, DataType: INT, Source: [ils_udlev.dbo.udlev.postdto] }
    DW_EK_Dato_Aflevering: { Type: FK, DataType: INT, Source: [ils_udlev.dbo.udlev.aflevdto] }

    Vareudlevering_Antal:  { Type: Measure, DataType: DECIMAL(18,4), Source: [ils_udlev.dbo.udlev.udlant] }
    Vareudlevering_Beloeb: { Type: Measure, DataType: DECIMAL(19,4), Source: [ils_udlev.dbo.udlev.udlbel] }
    Indkoeb_Beloeb:    { Type: Measure, DataType: DECIMAL(19,4), Source: [ils_udlev.dbo.udlev.indkbel] }
    Rabat_Beloeb:      { Type: Measure, DataType: DECIMAL(19,4), Source: [ils_udlev.dbo.udlev.rabatbel] }
    Lager_Antal:       { Type: Measure, DataType: DECIMAL(18,4), Source: [ils_udlev.dbo.udlev.lagerantal] }

    Datotid_Vareudlevering: { DataType: DATETIME2, Expr: "DATEADD(SECOND, udlklk, udldto)" }
    Datotid_Udloeb:         { DataType: DATETIME2, Source: [ils_udlev.dbo.udlev.udlobdto] }
    Datotid_Postering:      { DataType: DATETIME2, Source: [ils_udlev.dbo.udlev.postdto] }
    Datotid_Aflevering:     { DataType: DATETIME2, Expr: "DATEADD(SECOND, aflevklk, aflevdto)" }

    DW_haendelsestidspunkt: { DataType: DATETIME2, Expr: "DATEADD(SECOND, udlklk, udldto)" }
