dso_lineage:
  Type: fact
  TableName: fct.IndkoebsanalyseLinje
  Domain: [ERP]
  Description: >
    KMD Indkøbsanalyse fact — én række pr. SpendAnalysisLine fra KMD UdData.
    UNSPSC tilknyttes direkte på linjen via KMD dimension.UNSPSC (ikke via dim.Vare).
    Denne klassifikation erstatter behovet for personfølsomme fritekst-
    varebeskrivelser i rapportering (se decision 27276).
    Bro til MySupply fct.Fakturalinje er bevidst out of scope.
  Grain: "Én række pr. KMD fact.SpendAnalysisLines.DW_EK_SpendAnalysisLine"

  SourceSystems:
    - kmd_uddata: [fact.SpendAnalysisLines, dimension.UNSPSC]

  Columns:
    DW_EK_IndkoebsanalyseLinje:
      Type: PK
      DataType: INT
      Description: "Surrogate key fra map.IndkoebsanalyseLinje (IDENTITY)"
    CleanCode_IndkoebsanalyseLinje:
      DataType: NVARCHAR(500)
      Expr: "CONCAT('KMD_SAL_', CAST(DW_EK_SpendAnalysisLine AS NVARCHAR(20)))"
      Source: [kmd_uddata.fact.SpendAnalysisLines.DW_EK_SpendAnalysisLine]
    bk_SpendAnalysisLine:
      DataType: NVARCHAR(20)
      Source: [kmd_uddata.fact.SpendAnalysisLines.DW_EK_SpendAnalysisLine]
      Expr: "CAST(DW_EK_SpendAnalysisLine AS NVARCHAR(20))"

    DW_EK_UNSPSC:
      Type: FK
      DataType: INT
      FK-Target: dim.UNSPSC
      Source:
        - kmd_uddata.fact.SpendAnalysisLines.DW_SK_UNSPSC
        - kmd_uddata.dimension.UNSPSC.UNSPSCClassID
      Expr: >
        COALESCE((
          SELECT um.DW_EK_UNSPSC
          FROM [arc].[spend_analysis_lines_kmd_uddata] sal
          INNER JOIN [arc].[unspsc_kmd_uddata] ku
            ON ku.DW_SK_UNSPSC = sal.DW_SK_UNSPSC AND ku.DW_IsCurrent = 1
          INNER JOIN [map].[UNSPSC] um
            ON um.CleanCode_UNSPSC = ku.UNSPSCClassID
          WHERE sal.DW_EK_SpendAnalysisLine = <grain>
        ), -1)
      Description: >
        Direkte KMD UNSPSC-sti: DW_SK_UNSPSC → arc.unspsc_kmd_uddata (current)
        → map.UNSPSC.CleanCode_UNSPSC. Ikke via dim.Vare.

    DW_EK_Dato_SpendAnalysis:
      Type: FK
      DataType: INT
      Source: [kmd_uddata.fact.SpendAnalysisLines.DW_SK_Date_SpendAnalysis]
    DW_EK_Dato_Issue:
      Type: FK
      DataType: INT
      Source: [kmd_uddata.fact.SpendAnalysisLines.DW_SK_Date_Issue]
    DW_EK_Dato_OrderIssue:
      Type: FK
      DataType: INT
      Source: [kmd_uddata.fact.SpendAnalysisLines.DW_SK_Date_OrderIssue]
    DW_EK_Dato_ActualDelivery:
      Type: FK
      DataType: INT
      Source: [kmd_uddata.fact.SpendAnalysisLines.DW_SK_Date_ActualDelivery]
    DW_EK_Dato_PaymentDue:
      Type: FK
      DataType: INT
      Source: [kmd_uddata.fact.SpendAnalysisLines.DW_SK_Date_PaymentDue]
    DW_EK_Dato_Posting:
      Type: FK
      DataType: INT
      Source: [kmd_uddata.fact.SpendAnalysisLines.DW_SK_Date_Posting]

    IsCreditnote:
      DataType: BIT
      Source: [kmd_uddata.dimension.Invoice.IsCreditnote]
      Expr: "CAST(COALESCE(inv.IsCreditnote, 0) AS BIT)"
      Description: >
        Flag (0/1) fra KMD dimension.Invoice via DW_SK_Invoice FK på
        fact.SpendAnalysisLines → arc.invoice_kmd_uddata (DW_IsCurrent=1).
        Bruges til at filtrere kreditnotaer ud af spend-analyser.

    LineAmount:
      Type: Measure
      DataType: NUMERIC(38, 6)
      Source: [kmd_uddata.fact.SpendAnalysisLines.LineAmount]
    InvoicedQuantity:
      Type: Measure
      DataType: NUMERIC(38, 6)
      Source: [kmd_uddata.fact.SpendAnalysisLines.InvoicedQuantity]
    UnitPrice:
      Type: Measure
      DataType: NUMERIC(38, 6)
      Source: [kmd_uddata.fact.SpendAnalysisLines.UnitPrice]
    LineTaxAmount:
      Type: Measure
      DataType: NUMERIC(38, 6)
      Source: [kmd_uddata.fact.SpendAnalysisLines.LineTaxAmount]
    CO2Emission:
      Type: Measure
      DataType: NUMERIC(38, 6)
      Source: [kmd_uddata.fact.SpendAnalysisLines.CO2Emission]

    DW_haendelsestidspunkt:
      DataType: DATETIME2
      Source: [kmd_uddata.fact.SpendAnalysisLines.DW_ValidDate]
      Expr: "COALESCE(TRY_CONVERT(DATETIME2, DW_ValidDate), DW_Timestamp_Update)"
