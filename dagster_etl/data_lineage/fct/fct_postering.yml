dso_lineage:
  Type: fact
  TableName: fct.Postering
  Domain: [ERP]
  Description: "Finanspostering fact tabel — én række pr. postering fra SydAX"
  Grain: "Én række pr. finanspostering/bogføringstransaktion fra SydAX"

  SourceSystems:
    - sydax: [Kreditor.Kreditortransaktion, Finans.Finanspostering]

  Columns:
    ref_LedgertransId:    { DataType: BIGINT, Source: [sydax.Finans.Finanspostering.ref_LedgertransId] }

    DW_EK_Postering:     { Type: FK, DataType: INT, Source: [sydax.Finans.Finanspostering.Kildesystem, sydax.Finans.Finanspostering.ref_LedgertransId] }
    CleanCode_Postering: { DataType: NVARCHAR(100) }

    DW_EK_Kreditor:      { Type: FK, DataType: INT, Source: [sydax.Finans.Kreditor.JuridiskEnhed] }
    DW_EK_Kontoplan:     { Type: FK, DataType: INT, Source: [sydax.Finans.Finanspostering.FinanskontoId] }
    DW_EK_Faktura:       { Type: FK, DataType: INT, FK-Target: dim.Faktura, Expr: "hardcoded -1 (ikke opløst)" }
    DW_EK_Okosted:       { Type: FK, DataType: INT, FK-Target: dim.Okosted, Source: [sydax.Finans.OmkostningsstedHierarki.nummer1..nummer20], Expr: "Dybeste ikke-NULL niveau (nummer20..nummer1) → map.Okosted via CleanCode_Okosted" }
    DW_EK_Finanskladdelinje: { Type: FK, DataType: INT, Source: [sydax.Finans.Finanspostering.ref_LedgertransId] }

    DW_EK_Dato_Godkendelse:    { Type: FK, DataType: INT, Source: [sydax.Kreditor.Kreditortransaktion.GodkendtDato] }
    DW_EK_Dato_Lukket:         { Type: FK, DataType: INT, Source: [sydax.Kreditor.Kreditortransaktion.LukketDato] }
    DW_EK_Dato_TransOprettet:  { Type: FK, DataType: INT, Source: [sydax.Kreditor.Kreditortransaktion.Oprettelsestidspunkt] }
    DW_EK_Dato_Forfald:        { Type: FK, DataType: INT, Source: [sydax.Kreditor.Kreditortransaktion.Forfaldsdato] }
    DW_EK_Dato_JournalFaktura: { Type: FK, DataType: INT, Source: [sydax.Kreditor.Kreditortransaktion.Fakturadato] }
    DW_EK_Dato_SidstUdlignet:  { Type: FK, DataType: INT, Source: [sydax.Kreditor.Kreditortransaktion.SidstUdlignetDato] }
    DW_EK_Dato_Transaktion:    { Type: FK, DataType: INT, Source: [sydax.Kreditor.Kreditortransaktion.Transaktionsdato] }
    DW_EK_Dato_Bogfoering:     { Type: FK, DataType: INT, Source: [sydax.Finans.Finanspostering.Bogfoeringsdato] }
    DW_EK_Dato_PostOprettet:   { Type: FK, DataType: INT, Source: [sydax.Finans.Finanspostering.Oprettelsestidspunkt] }

    DW_haendelsestidspunkt:       { DataType: DATETIME2, Source: [sydax.Finans.Finanspostering.Oprettelsestidspunkt] }

    TransaktionsbeloebValuta:     { Type: Measure, DataType: DECIMAL(30,12), Source: [sydax.Kreditor.Kreditortransaktion.TransaktionsbeloebValuta] }
    Transaktionsbeloeb:           { Type: Measure, DataType: DECIMAL(30,12), Source: [sydax.Kreditor.Kreditortransaktion.Transaktionsbeloeb] }
    UdlignetBeloebValuta:         { Type: Measure, DataType: DECIMAL(30,12), Source: [sydax.Kreditor.Kreditortransaktion.UdlignetBeloebValuta] }
    UdlignetBeloeb:               { Type: Measure, DataType: DECIMAL(30,12), Source: [sydax.Kreditor.Kreditortransaktion.UdlignetBeloeb] }
    Posteringsbeloeb:             { Type: Measure, DataType: DECIMAL(30,12), Source: [sydax.Finans.Finanspostering.Posteringsbeloeb] }

    FakturaNr:                    { DataType: NVARCHAR(100), Source: [sydax.Kreditor.Kreditortransaktion.Fakturanummer] }

  Notes:
    - "SOR organisation for reporting: opløses via conceptmap.OkostedToSOR (vw_okosted_to_sor: DW_EK_Okosted → DW_EK_Organisation_Target). fct.Postering has no DW_EK_Organisation column."
