dso_lineage:
  Type: dimension
  TableName: dm.HAIBA_AggInfektionEgenskaber
  Domain: [HAIBA]
  DimModel: transaction
  TransactionDimFor: dm.HAIBA_AggInfektion
  Description: "Transaktionsdimension til dm.HAIBA_AggInfektion — kildens deskriptive kolonner (grainet) som rå værdier, 1:1 på dw_ek"
  Grain: "Én række pr. (HAI, HAIBA_dato, Rolle_ansvar, RegionKode, SORIdentifier) — samme grain som fakta"

  SourceSystems:
    - haiba: [agg_infektion]

  Columns:
    dw_ek_HAIBA_AggInfektion: { Type: PK, DataType: INT, Description: "Delt entitetsnøgle med dm.HAIBA_AggInfektion — mintes i map.HAIBA_AggInfektion." }
    HAI:                       { DataType: NVARCHAR(50), Source: [haiba.agg_infektion.HAI], Description: "HAI-type: BACT, UTI, COHA, HOHA" }
    HAIBA_dato:                { DataType: NVARCHAR(30), Source: [haiba.agg_infektion.HAIBA_dato], Description: "Rå datostreng fra kilden — den opløste nøgle bor på fakta (dw_ek_Dato)" }
    Rolle_ansvar:              { DataType: NVARCHAR(50), Source: [haiba.agg_infektion.Rolle_ansvar] }
    RegionKode:                { DataType: NVARCHAR(10), Source: [haiba.agg_infektion.RegionKode], Description: "Beholdes som org-tekstkolonne: bærer landsaggregat-skellet (8888/9999, tom SOR), som rapportering skelner på" }
    SORIdentifier:             { DataType: NVARCHAR(30), Source: [haiba.agg_infektion.SORIdentifier], Description: "Rå SOR-kode — den opløste nøgle bor på fakta (dw_ek_Organisation)" }
    leverance_dato:            { DataType: DATE, Expr: "Afledt af leverancefilens navn, ført med fra arc" }
    dw_is_deleted:             { DataType: BIT, Expr: "Ført med fra arc — se dm.HAIBA_AggInfektion" }
    dw_timestamp_insert:       { Type: Audit, DataType: DATETIME2(0), Expr: "SYSDATETIME() ved rebuild (TRUNCATE + INSERT)" }
    dw_timestamp_update:       { Type: Audit, DataType: DATETIME2(0), Expr: "SYSDATETIME() ved rebuild" }

  Notes:
    - "Rå SOR-koder og rå datostrenge bevares her, så en uopløst nøgle (-1) på fakta aldrig koster kildeværdien."
