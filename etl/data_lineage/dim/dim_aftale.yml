dso_lineage:
  Type: dimension
  TableName: dim.Aftale
  Domain: [ERP]
  Description: "Aftale-/kontraktdimension fra ILS — SCD Type 1. Noegle: (lnr, aftale). Baerer aktive, udloebne og slettede aftaler; kilden fjerner aftaler naar de udloeber, og de bevares her fordi historiske koeb refererer til dem. Udloebet = hoved_slut i fortiden."
  Grain: "Én række pr. (leverandoer, aftale) fra ILS. Ved flere arkivraekker pr. noegle vinder den nyeste (stoerste dw_timestamp_update i arc.ils_lafth)"
  SCD: type1

  SourceSystems:
    - ils: [dbo.lafth, dbo.laftd, dbo.lev, dbo.lafthsgh]

  Columns:
    dw_ek_Aftale:        { Type: PK, DataType: INT }
    clean_code_Aftale:   { DataType: NVARCHAR(255), Source: [ils.dbo.laftd.lnr, ils.dbo.lafth.aftale], Expr: "AFTALE_{lnr}_{aftalenr}" }
    aftale_nummer:       { DataType: NVARCHAR(100), Source: [ils.dbo.lafth.aftale] }
    leverandoernummer:   { DataType: NVARCHAR(100), Source: [ils.dbo.laftd.lnr] }
    dw_ek_Kreditor:      { Type: FK, DataType: INT, FK-Target: dim.Kreditor, Source: [ils.dbo.lev.se_nr], Description: "Via lnr -> lev.se_nr -> dim.Kreditor" }
    aftale_dato:         { DataType: DATETIME2, Source: [ils.dbo.lafth.aftdto] }
    aftale_ansvarlig:    { DataType: NVARCHAR(100), Source: [ils.dbo.lafth.ansvar] }
    aftaletype:          { DataType: NVARCHAR(50), Source: [ils.dbo.lafth.afttype] }
    aftaletekst:         { DataType: NVARCHAR(MAX), Source: [ils.dbo.lafth.txt] }
    hoved_start:         { DataType: DATETIME2, Source: [ils.dbo.lafth.start_] }
    hoved_slut:          { DataType: DATETIME2, Source: [ils.dbo.lafth.slut] }
    alle_maa_benytte:    { DataType: BIT, Source: [ils.dbo.lafthsgh.lnr, ils.dbo.lafthsgh.aftale], Expr: "1 = ingen lafthsgh-styringsraekker for aftalen (ILS \"Benyttes af\" blank) = alle sygehuse/lagre maa koebe ind; 0 = steering findes i bridge.AftaleLager. Spec 2026-08-31-prisloese-linjer-og-aftalelager.", Description: "Kendt begraensning: arc.ils_lafthsgh er upsert-only (detect_deletes=False) — ophaevet styring i ILS forsvinder ikke af sig selv; kraever manuel arc-oprydning eller delete-detektion paa arkivet." }
