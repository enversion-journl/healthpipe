dso_lineage:
  Type: dimension
  TableName: dim.Lager
  Domain: [ERP]
  Description: "Lagerdimension fra ILS med SOR-organisationskobling"
  Grain: "Én række pr. lager-/oplagringssted"

  SourceSystems:
    - ils: [dbo.sgh, dbo.lgr, codesystem.LagerHierarchy]
    # dbo.rekv is reached indirectly: lgr.lgrejer resolves against map.Rekvirent
    - sor: [SOR_registry]

  Columns:
    dw_ek_Lager:          { Type: PK, DataType: INT }
    code:                 { DataType: VARCHAR(100), Source: [ils.dbo.sgh.Code] }
    display:              { DataType: NVARCHAR(500), Source: [ils.dbo.sgh.Display] }
    parent_code:           { DataType: VARCHAR(100), Expr: "afledt af sgh-hierarki" }
    level:                { DataType: INT, Expr: "beregnet fra hierarkidybde i sgh" }
    entity_type:           { DataType: NVARCHAR(200), Source: [ils.dbo.sgh.entityType] }
    sgh:                  { DataType: NVARCHAR(200), Source: [ils.dbo.sgh.sgh] }
    lgr:                  { DataType: NVARCHAR(200), Source: [ils.dbo.lgr.lgr] }
    # Warehouse attributes. Previously documented as ils.dbo.sgh.* and in
    # practice always NULL: cs_lager never wrote the property keys. Corrected
    # here — they come from dbo.lgr, not from dbo.sgh.
    #
    # Two paths in: non-address details are carried by the CodeSystem as
    # properties; the address fields are joined into stg_dim_Lager on normalised
    # (sgh, lgr). See DSA/SQL/common/lager_adresse.py for why.
    adresse:
      DataType: NVARCHAR(200)
      Source: [ils.dbo.lgr.adr]
      Description: "Lagerets adresse (ILS: adr). Joinet ind udenom codesystemet"
    land:
      DataType: NVARCHAR(200)
      Source: [ils.dbo.lgr.land]
      Description: "Landekode. Joinet ind udenom codesystemet"
    postnummer:
      DataType: NVARCHAR(200)
      Source: [ils.dbo.lgr.postdi]
      Description: "Postnummer (ILS: postdi). Joinet ind udenom codesystemet"
    telefon:
      DataType: NVARCHAR(200)
      Source: [ils.dbo.lgr.tlf]
      Description: "Telefonnummer (ILS: tlf). Joinet ind udenom codesystemet"
    lagerejer_rekvirentnummer:
      DataType: NVARCHAR(200)
      Source: [ils.dbo.lgr.lgrejer]
      Description: "Rekvirent brugt til varebevaegelser ind paa lageret (ILS: lgrejer). Via codesystem.LagerProperties.lagerejerRekvirentnummer"
    svind_rekvirentnummer:
      DataType: NVARCHAR(200)
      Source: [ils.dbo.lgr.rekvsvind]
      Description: "Rekvirent brugt til at notere svind (ILS: rekvsvind). Via codesystem.LagerProperties.svindRekvirentnummer"
    standard_leveringsdage:
      DataType: INT
      Source: [ils.dbo.lgr.deflevdage]
      Description: "Standardleveringstid for lageret i dage (ILS: deflevdage). Via codesystem.LagerProperties.standardLeveringsdage"
    # aktiv is the exception: it is also set on sygehus rows, from dbo.sgh.aktiv.
    aktiv:
      DataType: BIT
      Source: [ils.dbo.lgr.aktiv, ils.dbo.sgh.aktiv]
      Description: "Kildens eget aktiv-flag paa lageret eller sygehuset (lgr.aktiv paa et lager, sgh.aktiv paa et sygehus). Tom for regionen og hvor kilden ikke angiver det. Via codesystem.LagerProperties.aktiv"
    code_sor:              { DataType: VARCHAR(50), Source: [sor.SOR_registry.CodeSOR] }
    dw_ek_Rekvirent_lagerejer:
      Type: FK
      DataType: INT
      FK-Target: dim.Rekvirent
      Source: [ils.dbo.lgr.lgrejer]
      Description: "FK til dim.Rekvirent via map.Rekvirent paa (sgh, lgrejer); -1 naar lagerejeren ikke kan oploeses"
    dw_ek_Rekvirent_svind:
      Type: FK
      DataType: INT
      FK-Target: dim.Rekvirent
      Source: [ils.dbo.lgr.rekvsvind]
      Description: "FK til dim.Rekvirent via map.Rekvirent paa (sgh, rekvsvind); -1 naar svind-rekvirenten ikke kan oploeses"
    dw_ek_Organisation:   { Type: FK, DataType: INT, Source: [sor.SOR_registry.SORId] }
    dw_ek_Lager_parent:   { Type: FK, DataType: INT, FK-Target: dim.Lager, Source: [ils.codesystem.LagerHierarchy.parent_code] }
