dso_lineage:
  Type: fhir
  TableName: fhir.Encounter_BedSpace
  Domain: [FHIR]
  Description: "FHIR Encounter.location-entries med physicalType=bd (seng). Afdelings-entries ligger i fhir.Encounter_Location, som ekskluderer bd."
  Grain: "Én række pr. sengeophold pr. kontakt pr. periodestart"
  FhirResource: Encounter

  SourceSystems:
    - ifdb_encounter: [IFDB.ENCOUNTER]
    - ifdb_encounter_bed_space_history: [IFDB.ENCOUNTER_BED_SPACE_HISTORY]

  Columns:
    encounter_id:          { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", FK-Target: fhir.Encounter, FK-Key: encounter_id, FK-Required: true, Description: "FHIR Encounter resource id (Aidbox UUID)." }
    location_id:           { DataType: NVARCHAR(255), FhirPath: "location.location.id", FK-Target: fhir.Bed, FK-Key: bed_id, FK-Required: false, FK-Ignore: [''], Description: "FHIR-tildelt seng-Location (Aidbox UUID) — resolver-tildelt ud fra BED_ID." }
    location_status:       { DataType: NVARCHAR(50), FhirPath: "location.status", Description: "FHIR EncounterLocationStatus (planned | active | reserved | completed). Afledt af KONTAKTENS status (ENCOUNTER.STATUS_TEXT), ikke af sengeopholdets egen periode: map_encounter_location_status laeser statusteksten foerst og falder kun tilbage paa perioden, naar teksten ikke kan afgoere det. Konsekvens: en afsluttet kontakt giver 'completed' paa alle sine sengeophold -- ogsaa de ca. 0,6 %, der aldrig blev registreret lukket og derfor har location_period_end = NULL. Kombinationen 'completed' + aaben slutdato er altsaa forventet og betyder «kontakten er slut, registreringen blev aldrig lukket», ikke at patienten stadig ligger der. Samme afledning bruges i fhir.Encounter_Location." }
    location_period_start: { DataType: NVARCHAR(50), FhirPath: "location.period.start", Source: [ifdb_encounter_bed_space_history.IFDB.ENCOUNTER_BED_SPACE_HISTORY.PERIOD_START_REGISTRATION], Description: "REGISTRERINGSTIDSPUNKT for sengeopholdet (kildens PERIOD_START_REGISTRATION), ikke et klinisk 'patienten lagde sig'-tidspunkt. FHIR's period er tiden patienten var til stede; en forsinket registrering forskyder derfor perioden. Kan ikke vaere NULL." }
    location_period_end:   { DataType: NVARCHAR(50), FhirPath: "location.period.end", Source: [ifdb_encounter_bed_space_history.IFDB.ENCOUNTER_BED_SPACE_HISTORY.PERIOD_END_REGISTRATION], Description: "Registreringstidspunkt for opholdets ophoer (kildens PERIOD_END_REGISTRATION). NULL naar opholdet ikke er registreret ophoert -- det betyder ikke noedvendigvis, at patienten stadig ligger der (maalt: ca. 0,6 % af registreringerne lukkes aldrig). Transporteres som i kilden; lukkes ikke ved kontaktens slut." }
    ward_unit_code:        { DataType: NVARCHAR(512), FhirPath: "location.extension.where(url='urn:source:ifdb:bed_space_ward_unit_code').valueString.first()", Source: [ifdb_encounter_bed_space_history.IFDB.ENCOUNTER_BED_SPACE_HISTORY.LOCATION_CODE], Description: "Kildens enhedskode for opholdet, som den var paa tidspunktet. Samme kodeomraade som fhir.WardUnit.admin_unit_code (maalt: 100 % direkte match) -- joinnoeglen fra belaegning til kapacitet pr. sengeenhed. Kilden garanterer kun hoejst én AKTIV sengeenhed pr. kode ad gangen, saa join'en skal gaa via fhir.WardUnit med status = 'active' og dw_is_deleted = 0; en genoprettet enhed (nyt OBJEKT_ID, samme kode) beholder sin slettede forgaenger og dennes kapacitetsperioder, som vi transporterer men ikke tolker. Invariant, der skal holde for at join'en er entydig: hoejst én aktiv WardUnit pr. admin_unit_code. NULL for raekker udsendt foer kolonnen blev indfoert." }
    dw_is_deleted:         { DataType: INT, Description: "Slettet-flag (0 = live, 1 = slettet). Warehouse-styret: projiceres ikke fra FHIR. Saettes til 1 af dqa_fhir_server_cleanup for raekker hvis Encounter er hard-slettet paa FHIR-serveren, og nulstilles til 0 ved MERGE-match (resurrect_soft_deleted), saa en genopstaaet resource ikke bliver haengende som slettet. NOT NULL DEFAULT 0." }
    last_updated:          { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:            { DataType: DATETIME2, FhirPath: "r.cts" }

  Notes:
    - "MERGE-config (sof_utils.py SOF_RESOURCE_CONFIGS): child_grain_reconcile=True + resurrect_soft_deleted=True. Et sengeophold, kilden ikke længere har, forsvinder fra Encounter.location, så MERGE'en aldrig rører den forældede række — reconcile er det, der pensionerer den."
    - "Berørte kontakter: ændringer i arc.ifdb_encounter_bed_space_history og arc.ifdb_absence re-emitterer parent-Encounter i delta-kørslen. Arkivet stempler dw_timestamp_update = SYSDATETIME() ved INSERT, så første delta efter arkivernes første load ser hele historikken som berørt — ikke kun fremadrettet berigelse."
    - "Berigelsen af de kontakter, der allerede ligger i Aidbox, tages med af det ORDINÆRE delta: migrationen 20260929_fhir_encounter_child_delta_reset nulstiller child-vandmærket (meta.DFMState: fhir_server / Encounter_ChildDelta) til 1900-01-01 med meta.usp_dfm_reset, og næste ordinære kørsel genposterer så alle kontakter med sengeophold eller fravær. Værnet i fhir_server_encounter_dfm (CHILD_TOUCHED_ENCOUNTERS_CEILING, 50.000) tæller kontakter berørt via sengeophold/fravær siden vandmærket. Kun en nulstilling helt til epoken (last_mode = reset OG værdien 1900-01-01) passerer loftet: dér skal hele historikken med, og et genindlæst arkiv kan ikke lægge mere til. En delvis nulstilling får ingen undtagelse. Efter kørslen står vandmærket med last_mode = delta, og loftet gælder igen."
    - "Child-deltaet måler på sit EGET vandmærke (meta.DFMState, fhir_server/Encounter_ChildDelta) og ikke på Encounter-checkpointet; ellers ville en tilbagerulning af Encounter-checkpointet flytte værnets tal. Vandmærket rykker kun efter en kørsel, der har læst child-rækkerne (delta eller full_load) — en ids- eller period-kørsel flytter det ikke — og til samme sikre punkt som checkpointet: læsningens start, holdt tilbage til en arkiv-MERGE, der stadig kører. Efter en nulstilling rykker det også, når der intet var at hente, så last_mode ikke bliver stående på reset."
    - "RUNBOOK trin 0, pr. miljø — kør full_infrastructure_setup ved deploy, som ved ethvert deploy. Det kører migrationerne på staging og DSO (bl.a. 20260929_fhir_encounter_child_delta_reset) og opretter DSO-siden af de fem fhir-tabeller. Springes det over, kører FHIR-kæden alligevel, men DSO-leddet fejler med skemaafvigelse. KONTROL bagefter, fordi migrationernes advarsler (PRINT) ikke når Dagster-loggen: (a) fhir.Condition_tillaegskode, fhir.Procedure_tillaegskode og fhir.ServiceRequest_tillaegskode må ikke findes på staging eller DSO — findes de, har omdøbningen fundet en ikke-tom måltabel og lod begge stå; (b) efter første natkørsel skal fhir_server_encounter_dfm have metadata child_watermark_reset = true, medmindre miljøet allerede var beriget."
    - "RUNBOOK, pr. miljø: deploy + full_infrastructure_setup (trin 0) — ikke andet. Migrationen skelner tre tilfælde: er kontakterne allerede beriget, røres intet; har Encounter-assetet kørt, nulstilles vandmærket, og første natkørsel beriger alle kontakter; har det ikke kørt, er dets første kørsel en fuld indlæsning, der beriger alt. Metadata-feltet child_watermark_reset = true på fhir_server_encounter_dfm viser, hvilken kørsel der tog berigelsen."
    - "Berigelsen dækker også kontakter, der ALLEREDE er beriget i et miljø: bærer deres Aidbox-ressourcer en tidligere extension-URL, står deres ward_unit_code tom, indtil de genposteres — så en ændring i det, berigelsen udsender, kræver en genkørsel (se næste note)."
    - "Efter en ændring i det, berigelsen udsender (fx en ny extension-URL), køres berigelsen igen ad samme vej: dfm_reset med schema_name = fhir_server, table_name = Encounter_ChildDelta, new_value = 1900-01-01 00:00:00 — næste ordinære kørsel tager så alle kontakter med igen. Og husk at genregistrere SoF-ViewDefinitions (fhir_sof_infrastructure) FØR projektionen: ellers serverer Aidbox den gamle sti, og ward_unit_code står tavst tom."
