dso_lineage:
  Type: fhir
  TableName: fhir.Procedure
  Domain: [FHIR]
  Description: "FHIR Procedure ressource — kliniske og administrative procedurer"
  Grain: "Én række pr. Procedure-ressource fra AKTIVITETSRESULTAT (hoved + deloperation), ADMINISTRATIVE_PROCEDURE eller RIS_YDELSE"
  Privacy: >
    Tabellen bærer medarbejderoplysninger: practitioner_id er klinikerens
    medarbejder-id fra kilden, og practitioner_display er klinikerens navn, som
    kilden skrev det. Det er personoplysninger om ansatte, ikke om patienter.
    Kolonnerne er nye på aftagerfladen med denne leverance. Adgangen til dem
    følger DSO's almindelige adgangsstyring og er IKKE kolonnebegrænset eller
    maskeret; om det er tilstrækkeligt, er et udestående punkt, der skal
    afgøres af dataejeren før udrulning til QA og produktion.
  FhirResource: Procedure

  SourceSystems:
    - ifdb_aktivitetsresultat: [IFDB.AKTIVITETSRESULTAT]
    - ifdb_administrative_procedure: [IFDB.ADMINISTRATIVE_PROCEDURE]
    - ifdb_ris_ydelse: [IFDB.RIS_YDELSE]
    - ifdb_adm_procedure_suppl_codes: [IFDB.ADM_PROCEDURE_SUPPL_CODES]

  Columns:
    procedure_id:           { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", Description: "FHIR resource id (Aidbox UUID) — resolver-/servertildelt ved posting. Forretningsnøglen bæres i Procedure.identifier (source_system)." }
    patient_id:             { DataType: NVARCHAR(255), FhirPath: "subject.id", FK-Target: fhir.Patient, FK-Key: patient_id, FK-Required: true, Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.PATIENT_ID, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PATIENT_ID, ifdb_ris_ydelse.IFDB.RIS_YDELSE.PATIENT_ID], Description: "FHIR-tildelt Patient-reference (Aidbox UUID) — resolver-tildelt ved posting ud fra IFDB PATIENT_ID; ikke direkte projiceret fra kilden." }
    encounter_id:           { DataType: NVARCHAR(255), FhirPath: "encounter.id", FK-Target: fhir.Encounter, FK-Key: encounter_id, FK-Required: false, Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.ENCOUNTER_ID, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.ENCOUNTER_ID, ifdb_ris_ydelse.IFDB.RIS_YDELSE.ENCOUNTER_ID], Description: "FHIR-tildelt Encounter-reference (Aidbox UUID) — resolver-tildelt ved posting ud fra IFDB ENCOUNTER_ID; ikke direkte projiceret fra kilden." }
    episode_of_care_id:     { DataType: NVARCHAR(255), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/episodeOfCare').valueReference.id", FK-Target: fhir.EpisodeOfCare, FK-Key: episode_of_care_id, FK-Required: false, Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.EPISODE_OF_CARE_ID, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.EPISODE_OF_CARE_ID, ifdb_ris_ydelse.IFDB.RIS_YDELSE.EPISODE_OF_CARE_ID], Description: "FHIR-tildelt EpisodeOfCare-reference (Aidbox UUID) — resolver-tildelt ved posting ud fra IFDB EPISODE_OF_CARE_ID; ikke direkte projiceret fra kilden." }
    status:                 { DataType: NVARCHAR(50), FhirPath: "status", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.SLETTET, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.DELETED, ifdb_ris_ydelse.IFDB.RIS_YDELSE.SLETTET], Expr: "FHIR-status udledt af kildens sletteflag: entered-in-error naar flaget er sat, ellers completed. Ikke kildens egen statuskode — den ligger i status_code.", Description: "Registreringens FHIR-status. Skelner mellem gennemført og tilbagekaldt registrering." }
    category_code:          { DataType: NVARCHAR(255), FhirPath: "category.coding.code", Expr: "Fast værdi 'radiology' på RIS-procedurer; tom for SFI og administrative procedurer. Ikke afledt af en kildekolonne.", Description: "Kategori — sættes fast for RIS-kilden og kan bruges som markør for radiologi-procedurer." }
    category_display:       { DataType: NVARCHAR(500), FhirPath: "category.coding.display", Expr: "Fast visningstekst hørende til den faste RIS-kategori. Ikke afledt af en kildekolonne.", Description: "Visningstekst for kategorien." }
    code:                   { DataType: NVARCHAR(255), FhirPath: "code.coding.where(userSelected = true).code.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.AKTIVITETTYPE_KODE, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PROCEDURE_CODE, ifdb_ris_ydelse.IFDB.RIS_YDELSE.XML] }
    code_system:            { DataType: NVARCHAR(500), FhirPath: "code.coding.where(userSelected = true).system.first()" }
    code_display:           { DataType: NVARCHAR(500), FhirPath: "code.coding.where(userSelected = true).display.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.AKTIVITETTYPE_KODETEKST, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PROCEDURE_TEXT, ifdb_ris_ydelse.IFDB.RIS_YDELSE.XML] }
    performed_datetime:     { DataType: NVARCHAR(50), FhirPath: "performedDateTime", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.PERIOD_START, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PERIOD_START, ifdb_ris_ydelse.IFDB.RIS_YDELSE.UDFOERT_TIDSPUNKT] }
    performed_period_start: { DataType: NVARCHAR(50), FhirPath: "performedPeriod.start", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.PERIOD_START, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PERIOD_START, ifdb_ris_ydelse.IFDB.RIS_YDELSE.PERIOD_START], Description: "Kilderækkens administrative aktivitetsperiode, start. Ikke det samme som knivtid_start." }
    performed_period_end:   { DataType: NVARCHAR(50), FhirPath: "performedPeriod.end", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.PERIOD_END, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.PERIOD_END, ifdb_ris_ydelse.IFDB.RIS_YDELSE.PERIOD_END], Description: "Kilderækkens administrative aktivitetsperiode, slut. Ikke det samme som knivtid_slut." }
    body_site_code:         { DataType: NVARCHAR(255), FhirPath: "bodySite.coding.code", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.INDICATION_OF_SIDE_CODE], Description: "Sidemarkering på proceduren. Kun administrative procedurer. Visningsteksten hentes ved opslag i codesystem.IFDBConcept og projiceres ikke." }
    source_system:          { DataType: NVARCHAR(100), FhirPath: "identifier.system" }
    source_identifier_value: { DataType: NVARCHAR(255), FhirPath: "identifier.value.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.OBJEKT_ID, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.OBJECT_ID, ifdb_ris_ydelse.IFDB.RIS_YDELSE.OBJEKT_ID], FK-None: true, Expr: "Forretningsnøglen fra den kilde, source_system peger på. Samme rækkefølge som source_system, så de to altid hører sammen.", Description: "Kildens nøgle, uanset hvilken af de tre procedurekilder rækken kommer fra." }
    ifdb_aktivitet_id:      { DataType: NVARCHAR(255), FhirPath: "identifier.where(system='urn:source:ifdb:aktivitetsresultat_procedure').value.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.OBJEKT_ID], FK-None: true, Description: "Kun AKTIVITETSRESULTAT-identifier (hoved = OBJEKT_ID, delop = {OBJEKT_ID}-delop-{n}). AdminProc/RIS bruger andre identifier-systemer og lander NULL her." }
    part_of_id:             { DataType: NVARCHAR(255), FhirPath: "partOf.id.first()", FK-Target: fhir.Procedure, FK-Key: procedure_id, FK-Required: false, Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.OBJEKT_ID], Description: "Peger fra en deloperation til hovedoperationen. NULL på hovedoperationer." }
    knivtid_start:          { DataType: DATETIME2, FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/aktivitetsresultatProcedureSourceMeta').extension.where(url='knivtidStart').valueDateTime.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML], Description: "Tidspunkt hvor der reelt blev opereret fra. Ikke det samme som performed_period, der er kilderaekkens administrative aktivitetsperiode." }
    knivtid_slut:           { DataType: DATETIME2, FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/aktivitetsresultatProcedureSourceMeta').extension.where(url='knivtidSlut').valueDateTime.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML], Description: "Tidspunkt hvor operationen sluttede. Normaliseres til dansk tid ved load." }
    knivtid_minutter:       { DataType: INT, FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/aktivitetsresultatProcedureSourceMeta').extension.where(url='knivtidMinutter').valueInteger.first()", Expr: "Beregnet i byggelaget som knivtid_slut minus knivtid_start i hele minutter. NULL når et af tidspunkterne mangler eller ikke kan læses.", Description: "Knivtidens varighed i minutter." }
    lpr3_ignored:           { DataType: BIT, FhirPath: "meta.tag.where(system = 'http://example.org/fhir/CodeSystem/resource-flag' and code = 'lpr3-ignored').exists()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.LPR3_IGNORED, ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.LPR3_IGNORED, ifdb_ris_ydelse.IFDB.RIS_YDELSE.LPR3_IGNORED], Expr: "Mærket sættes kun når kildens flag er sandt, så loadet skriver 0 eller 1 og aldrig NULL. Rækker fra før kolonnen fandtes står NULL, indtil genkørslen har skrevet dem om — derefter strammes DDL til NOT NULL.", Description: "Registreringen skal ikke indberettes til Landspatientregisteret." }
    status_code:            { DataType: NVARCHAR(512), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/procedureSourceMeta').extension.where(url='statusCode').valueString.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.STATUS_CODE], Description: "Kildens egen statuskode (rå). Kun administrative procedurer. Teksten står i status_text; parret er ikke entydigt og kan derfor ikke løftes til kodesystemet." }
    status_text:            { DataType: NVARCHAR(500), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/procedureSourceMeta').extension.where(url='statusText').valueString.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.STATUS_TEXT], Description: "Kildens statustekst (rå). Kun administrative procedurer." }
    used_contrast_code: { DataType: NVARCHAR(512), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/procedureSourceMeta').extension.where(url='usedContrastCode').valueString.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.USED_CONTRAST_CODE], Description: "Kildens kontrastkode; bevares også ved lav udfyldning." }
    used_contrast_text: { DataType: NVARCHAR(512), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/procedureSourceMeta').extension.where(url='usedContrastText').valueString.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.USED_CONTRAST_TEXT], Description: "Kildens kontrasttekst." }
    staff_category_code: { DataType: NVARCHAR(512), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/procedureSourceMeta').extension.where(url='staffCategoryCode').valueString.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.STAFF_CATEGORY_CODE], Description: "Kildens personalekategori som kode." }
    location_code: { DataType: NVARCHAR(255), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/procedureLocationMeta').extension.where(url='code').valueString.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.LOCATION_CODE], FK-None: true, Description: "Kildesystemets egen afdelingskode for den udførende enhed. Kun administrative procedurer. Findes hverken i SOR eller SHAK og kan ikke hentes ved opslag." }
    location_orgcode: { DataType: NVARCHAR(512), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/procedureLocationMeta').extension.where(url='orgCode').valueString.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.LOCATION_ORGCODE], FK-None: true, Description: "Kildesystemets egen organisationskode for den udførende enhed. Findes hverken i SOR eller SHAK og kan ikke hentes ved opslag." }
    stamafdeling_kode: { DataType: NVARCHAR(512), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/risYdelseLocationMeta').extension.where(url='stamafdelingKode').valueString.first()", Source: [ifdb_ris_ydelse.IFDB.RIS_YDELSE.STAMAFD_KODE], FK-None: true, Description: "Kildesystemets egen afdelingskode for stamafdelingen. Kun RIS-ydelser. Findes hverken i SOR eller SHAK og kan ikke hentes ved opslag." }
    stamafdeling_orgkode: { DataType: NVARCHAR(512), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/risYdelseLocationMeta').extension.where(url='stamafdelingOrgkode').valueString.first()", Source: [ifdb_ris_ydelse.IFDB.RIS_YDELSE.STAMAFD_ORGKODE], FK-None: true, Description: "Kildesystemets egen organisationskode for stamafdelingen. Findes hverken i SOR eller SHAK og kan ikke hentes ved opslag." }
    udfoert_enhed_kode: { DataType: NVARCHAR(512), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/risYdelseLocationMeta').extension.where(url='udfoertEnhedKode').valueString.first()", Source: [ifdb_ris_ydelse.IFDB.RIS_YDELSE.UDFOERT_ADMENHED_KODE], FK-None: true, Description: "Kildesystemets egen afdelingskode for den udførende enhed. Kun RIS-ydelser. Findes hverken i SOR eller SHAK og kan ikke hentes ved opslag." }
    udfoert_enhed_orgkode: { DataType: NVARCHAR(512), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/risYdelseLocationMeta').extension.where(url='udfoertEnhedOrgkode').valueString.first()", Source: [ifdb_ris_ydelse.IFDB.RIS_YDELSE.UDFOERT_ADMENHED_ORGKODE], FK-None: true, Description: "Kildesystemets egen organisationskode for den udførende enhed. Findes hverken i SOR eller SHAK og kan ikke hentes ved opslag." }
    performer_organization_id: { DataType: NVARCHAR(255), FhirPath: "performer.where(function.coding.code = 'udfoerende').actor.id.first()", FK-Target: fhir.Organization, FK-Key: organization_id, FK-Required: false, Description: "FHIR-tildelt Organization-reference (Aidbox UUID) til den udførende enhed — resolver-tildelt ved posting ud fra SOR-kode (IFDB.ADMINISTRATIVE_PROCEDURE.LOCATION_SORCODE / IFDB.RIS_YDELSE.UDFOERT_ADMENHED_SORCODE); ikke direkte projiceret fra kilden. Navn, type og hierarki findes via fhir.Organization." }
    stamafdeling_organization_id: { DataType: NVARCHAR(255), FhirPath: "performer.where(function.coding.code = 'stamafdeling').actor.id.first()", FK-Target: fhir.Organization, FK-Key: organization_id, FK-Required: false, Description: "FHIR-tildelt Organization-reference (Aidbox UUID) til stamafdelingen — resolver-tildelt ved posting ud fra IFDB.RIS_YDELSE.STAMAFD_SORCODE. Kun RIS-ydelser." }
    practitioner_id:        { DataType: NVARCHAR(255), FhirPath: "performer.actor.where(type = 'Practitioner').identifier.value.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.USER_ID, ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.UDFOERT_PERSID], FK-None: true, Description: "Medarbejder-id for den kliniker, der står som performer. Identifier-reference: kildens id projiceres direkte som på Observation og QuestionnaireResponse. Kan joines til EPJI-rækkerne i fhir.Practitioner: f.practitioner_id COLLATE Latin1_General_BIN2 = p.identifier_staff_exact AND p.dw_is_deleted = 0. Uden COLLATE rammer en kode, der findes i to stavemåder, begge konti. Filteret på dw_is_deleted giver højst én række pr. kode; en konto, der er slettet i EPJ, rammes ikke. Enkelte koder er systembrugere uden en række i fhir.Practitioner." }
    practitioner_display:   { DataType: NVARCHAR(500), FhirPath: "performer.actor.where(type = 'Practitioner').display.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.USER_NAME, ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.UDFOERT_PERSNAVN], Description: "Klinikerens navn som kilden skrev det." }
    practitioner_role_code: { DataType: NVARCHAR(255), FhirPath: "performer.where(actor.type = 'Practitioner').function.coding.code.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.USER_ROLE], Description: "Klinikerens rolle (kode) på proceduren. Kun administrative procedurer." }
    practitioner_role_display: { DataType: NVARCHAR(500), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/procedureSourceMeta').extension.where(url='userRoleName').valueString.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.USER_ROLE_NAME], Description: "Klinikerens rolle (tekst). Kun administrative procedurer." }
    epji_created_at:        { DataType: DATETIME2, FhirPath: "extension('http://example.org/fhir/StructureDefinition/sourceCreatedAt').valueDateTime.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.EPJI_CREATED_DATETIME], Description: "Oprettelsestidspunkt i EPJ. Kun administrative procedurer. Offset konverteres til Europe/Copenhagen før lagring uden tidszone; naive værdier bevares, undersekunder afkortes." }
    epji_modified_at:       { DataType: DATETIME2, FhirPath: "extension('http://example.org/fhir/StructureDefinition/sourceModifiedAt').valueDateTime.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.EPJI_MODIFICATION_DATETIME], Description: "Seneste ændring i EPJ. Kun administrative procedurer. Offset konverteres til Europe/Copenhagen før lagring uden tidszone; naive værdier bevares, undersekunder afkortes." }
    ifdb_modified_at:       { DataType: NVARCHAR(50), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/procedureSourceMeta').extension.where(url='ifdbModifiedAt').valueString.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.IFDB_MODIFICATION_DATETIME], Description: "Seneste ændring i IFDB (rå tekst fra kilden). Kun administrative procedurer." }
    dw_is_deleted:          { DataType: INT, FhirPath: "extension('urn:fhir:isDeleted').valueInteger.first()", Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.DELETED, ifdb_ris_ydelse.IFDB.RIS_YDELSE.SLETTET], Description: "Slettet-flag (1 = slettet) fra kildens deletion-markør. NOT NULL DEFAULT 0; manglende extension coalesces til 0 i loadet." }
    last_updated:           { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:             { DataType: DATETIME2, FhirPath: "r.cts" }

  # FHIR-resource-felter som bygges/postes til Aidbox men IKKE projiceres ned i
  # den flade fhir.Procedure DWH-tabel (SoF-viewet udelader dem). Bevaret her som
  # lineage-dokumentation; ignoreres af lineage↔DDL-verifieren og star-schema-generatoren.
  NonProjectedFhirFields:
    performer:                 { DataType: NVARCHAR(MAX), FhirPath: "performer", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }

  # Kolonner, som aftagerviewet vw_fhir.Procedure lægger til ved opslag i
  # codesystem.IFDBConcept, og som derfor ikke står i den flade fhir.Procedure-tabel.
  # Ignoreres af lineage↔DDL-verifieren; en test holder listen i takt med viewet.
  ViewColumns:
    body_site_display:   { DataType: NVARCHAR(500), Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.INDICATION_OF_SIDE_TEXT], Expr: "LEFT JOIN codesystem.IFDBConcept ON code = body_site_code", Description: "Kildens tekst for sidemarkeringen. Kun administrative procedurer." }
    staff_category_text: { DataType: NVARCHAR(500), Source: [ifdb_administrative_procedure.IFDB.ADMINISTRATIVE_PROCEDURE.STAFF_CATEGORY_TEXT], Expr: "LEFT JOIN codesystem.IFDBConcept ON code = staff_category_code", Description: "Kildens tekst for personalekategorien. Kun administrative procedurer." }
