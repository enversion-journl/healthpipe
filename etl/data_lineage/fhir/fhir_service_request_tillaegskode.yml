dso_lineage:
  Type: fhir
  TableName: fhir.ServiceRequest_tillaegskode
  Domain: [FHIR]
  Description: "RIS bestilte tillægskoder (orderDetail) på ServiceRequest — child-tabel i eget grain."
  Grain: "Én række pr. tillægskode pr. ServiceRequest — PK: service_request_id + tillaegskode_kode + tillaegskode_system"
  FhirResource: ServiceRequest

  SourceSystems:
    - ifdb_ris_ydelse: [IFDB.RIS_YDELSE]

  Columns:
    service_request_id:  { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", FK-Target: fhir.ServiceRequest, FK-Key: service_request_id, FK-Required: true }
    source_identifier_value: { DataType: NVARCHAR(255), FhirPath: "identifier.value.first()", FK-None: true, Source: [ifdb_ris_ydelse.IFDB.RIS_YDELSE.OBJEKT_ID], Description: "Komposit kildenøgle OBJEKT_ID:element_nummer (ydelses-niveau) — modsat de andre child-tabellers rene kilde-id." }
    tillaegskode_kode:   { Type: PK, DataType: NVARCHAR(255), FhirPath: "code", Source: [ifdb_ris_ydelse.IFDB.RIS_YDELSE.XML] }
    tillaegskode_system: { Type: PK, DataType: NVARCHAR(500), FhirPath: "system" }
    tillaegskode_display: { DataType: NVARCHAR(500), FhirPath: "display" }
    dw_is_deleted:       { DataType: INT, Description: "Slettet-flag (0 = live, 1 = slettet). Warehouse-styret: foraeldre-resourcen baerer urn:fhir:isDeleted, men dette grain projicerer ikke feltet — det saettes kun af dqa_fhir_server_cleanup naar foraeldre-resourcen er hard-slettet i Aidbox, og nulstilles ved MERGE-match. NOT NULL DEFAULT 0. BEMAERK: '= 0' betyder 'ikke markeret af cleanup', IKKE 'findes stadig under foraeldren' — child-grain reconcile er ikke slaaet til her." }
    last_updated:        { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:          { DataType: DATETIME2, FhirPath: "r.cts" }
