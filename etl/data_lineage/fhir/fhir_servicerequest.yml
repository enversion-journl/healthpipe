    dw_ek_Organisation_henvist_fra: { Type: FK, DataType: INT, Expr: "dim.Organisation.dw_ek_Organisation hvor fhir_Organization_id = requester_id", Description: "Organisationen, der har henvist (afsender anmodningen). -1 når anmodningen ikke har en afsender, eller organisationen ikke findes i dim.Organisation." }

  # Kolonner, som aftagerviewet vw_fhir.ServiceRequest lægger til ved opslag, og som
  # derfor ikke står i den flade fhir.ServiceRequest-tabel. Teksten hører til koden og
  # står ét sted, codesystem.IFDBConcept, i stedet for på hver række. Ignoreres af
