dso_lineage:
  Type: fhir
  TableName: fhir.CarePlan_Activity
  Domain: [FHIR]
  Description: "FHIR CarePlan Activity — alle markørforløbsaktiviteter"
  Grain: "Én række pr. aktivitet (hændelsesmarkør) i en behandlingsplan"
  FhirResource: CarePlan

  SourceSystems:
    - ifdb: [IFDB.EVENTMARKER]

  Columns:
    ifdb_eventmarker_id: { Type: PK, DataType: NVARCHAR(255), FhirPath: "activity.extension(activity-source-identifier).valueIdentifier.value", Source: [ifdb.IFDB.EVENTMARKER.OBJECT_ID] }
    careplan_id:         { DataType: NVARCHAR(255), FhirPath: "id", FK-Target: fhir.CarePlan, FK-Key: careplan_id, FK-Required: true }
    patient_id:          { DataType: NVARCHAR(255), FhirPath: "subject.getReferenceKey(Patient)", FK-Target: fhir.Patient, FK-Key: patient_id, FK-Required: true, Description: "FHIR-tildelt Patient-reference (Aidbox UUID) — resolver-tildelt ved posting ud fra IFDB.EVENTMARKER.patient_id_ifdb; ikke direkte projiceret fra kilden." }
    category_code:       { DataType: NVARCHAR(100), FhirPath: "category[0].coding[0].code" }
    episode_of_care_id:  { DataType: NVARCHAR(255), FhirPath: "activity.extension(activity-episode-of-care).valueReference.id", FK-Target: fhir.EpisodeOfCare, FK-Key: episode_of_care_id, FK-Required: false }
    markoerkode:         { DataType: NVARCHAR(255), FhirPath: "activity.outcomeCodeableConcept[0].coding[0].code", Source: [ifdb.IFDB.EVENTMARKER.EVENT_CODE] }
    markoer_display:     { DataType: NVARCHAR(500), FhirPath: "activity.outcomeCodeableConcept[0].coding[0].display", Source: [ifdb.IFDB.EVENTMARKER.EVENT_CODE], Description: "Afledt af EVENT_CODE: '<type>: <kode>', ellers kun koden. EVENT_TEXT lander i activity.detail.description, som viewet ikke projicerer." }
    organization_id:     { DataType: NVARCHAR(255), FhirPath: "activity.detail.performer.getReferenceKey(Organization)", FK-Target: fhir.Organization, FK-Key: organization_id, FK-Required: false }
    practitioner_id:     { DataType: NVARCHAR(255), FhirPath: "activity.detail.performer.getReferenceKey(Practitioner)", FK-None: true, Description: "Altid NULL. EVENTMARKER.RESPONSIBLE_STAFF_PERSID bevares som bar Identifier paa performer, men opløses ikke: Practitioner kommer fra et andet kildesystem med et andet identifier-system, saa en kobling kraever en crosswalk." }
    activity_timestamp:  { DataType: NVARCHAR(50), FhirPath: "activity.detail.scheduledPeriod.start", Source: [ifdb.IFDB.EVENTMARKER.TIME] }
    dw_is_deleted:       { DataType: INT, Description: "Slettet-flag (0 = live, 1 = slettet). Warehouse-styret: resourcen baerer ingen urn:fhir:isDeleted-extension, og viewet projicerer ikke feltet. Saettes til 1 af dqa_fhir_server_cleanup naar foraeldre-resourcen er hard-slettet i Aidbox, og af child-grain reconcile naar en markoer forsvinder fra en fortsat levende CarePlan; nulstilles til 0 ved MERGE-match. NOT NULL DEFAULT 0, saa '= 0' betyder 'findes stadig under foraeldren'." }
    last_updated:        { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:          { DataType: DATETIME2, FhirPath: "r.cts" }
