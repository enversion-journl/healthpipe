dso_lineage:
  Type: fhir
  TableName: fhir.CarePlan_Activity
  Domain: [FHIR]
  Description: "FHIR CarePlan Activity — alle markørforløbsaktiviteter"
  Grain: "Én række pr. aktivitet (hændelsesmarkør) i en behandlingsplan"
  Privacy: >
    practitioner_id er klinikerens medarbejder-id fra kilden. Kolonnen fandtes
    før denne leverance, men var altid NULL, fordi opslaget pegede på
    Practitioner-ressourcer, der ikke findes; den bærer nu kildens id. Det er
    en personoplysning om en ansat, ikke om en patient. Adgangen følger DSO's
    almindelige adgangsstyring og er IKKE kolonnebegrænset eller maskeret; om
    det er tilstrækkeligt, er et udestående punkt, der skal afgøres af
    dataejeren før udrulning til QA og produktion.
  FhirResource: CarePlan

  SourceSystems:
    - ifdb: [IFDB.EVENTMARKER]

  Columns:
    ifdb_eventmarker_id: { Type: PK, DataType: NVARCHAR(255), FhirPath: "activity.extension(activity-source-identifier).valueIdentifier.value", Source: [ifdb.IFDB.EVENTMARKER.OBJECT_ID], Description: "Markørens id i IFDB. Bæres i den regionale extension activity-source-identifier, fordi en aktivitet i FHIR ikke har et identifier-felt." }
    careplan_id:         { DataType: NVARCHAR(255), FhirPath: "id", FK-Target: fhir.CarePlan, FK-Key: careplan_id, FK-Required: true, Description: "FHIR-tildelt reference til det markørforløb i fhir.CarePlan, aktiviteten hører til." }
    patient_id:          { DataType: NVARCHAR(255), FhirPath: "subject.getReferenceKey(Patient)", FK-Target: fhir.Patient, FK-Key: patient_id, FK-Required: true, Source: [ifdb.IFDB.EVENTMARKER.PATIENT_ID], Description: "FHIR-tildelt Patient-reference (Aidbox UUID) — resolver-tildelt ved posting ud fra IFDB.EVENTMARKER.PATIENT_ID; ikke direkte projiceret fra kilden." }
    category_code:       { DataType: NVARCHAR(100), FhirPath: "category[0].coding[0].code", Expr: "Konstant 'alle_markoerer'", Description: "FHIR-tildelt. Altid 'alle_markoerer'; arves fra forløbet i fhir.CarePlan." }
    episode_of_care_id:  { DataType: NVARCHAR(255), FhirPath: "activity.extension(activity-episode-of-care).valueReference.id", FK-Target: fhir.EpisodeOfCare, FK-Key: episode_of_care_id, FK-Required: false, Source: [ifdb.IFDB.EVENTMARKER.EPISODE_OF_CARE_ID], Description: "Reference til det forløb i fhir.EpisodeOfCare, markøren er registreret på. Bæres i den regionale extension activity-episode-of-care. Tom, hvis markøren ikke er knyttet til et forløb, eller forløbet ikke findes i fhir.EpisodeOfCare." }
    outcome_codeable_concept_code:    { DataType: NVARCHAR(255), FhirPath: "activity.outcomeCodeableConcept[0].coding[0].code", Source: [ifdb.IFDB.EVENTMARKER.EVENT_CODE], Expr: "EVENT_CODE uden præfikset 'SKS.a.adm'", Description: "Markørens SKS-kode, fx 'AFV01A1'. Standard-FHIR-elementet CarePlan.activity.outcomeCodeableConcept; ikke en extension. Tom, hvis EVENT_CODE ikke starter med 'SKS.a.adm'." }
    outcome_codeable_concept_system:  { DataType: NVARCHAR(500), FhirPath: "activity.outcomeCodeableConcept[0].coding[0].system", Expr: "Konstant 'urn:oid:1.2.208.176.2.4', når der er en kode", Description: "FHIR-tildelt. Kodesystemet for outcome_codeable_concept_code: altid SKS (urn:oid:1.2.208.176.2.4), når koden er udfyldt; ellers tom." }
    outcome_codeable_concept_display: { DataType: NVARCHAR(500), FhirPath: "activity.outcomeCodeableConcept[0].coding[0].display", Source: [ifdb.IFDB.EVENTMARKER.EVENT_CODE], Description: "Visningstekst til outcome_codeable_concept_code, fx 'AFV: AFV01A1'; display-feltet i samme FHIR-element. Afledt af EVENT_CODE: '<type>: <kode>', ellers kun koden. EVENT_TEXT lander i activity.detail.description, som viewet ikke projicerer." }
    organization_id:     { DataType: NVARCHAR(255), FhirPath: "activity.detail.performer.getReferenceKey(Organization)", FK-Target: fhir.Organization, FK-Key: organization_id, FK-Required: false, Source: [ifdb.IFDB.EVENTMARKER.ADMINISTRATIVE_UNIT_SORCODE], Description: "Reference til markørens administrative enhed i fhir.Organization, slået op via SOR-koden. Tom, hvis markøren ikke har en SOR-kode, eller enheden ikke findes i fhir.Organization." }
    practitioner_id:     { DataType: NVARCHAR(255), FhirPath: "activity.detail.performer.where(identifier.system = 'urn:source:ifdb:staff').identifier.value.first()", FK-None: true, Source: [ifdb.IFDB.EVENTMARKER.RESPONSIBLE_STAFF_PERSID], Description: "EVENTMARKER.RESPONSIBLE_STAFF_PERSID som kilde-id under urn:source:ifdb:staff. Historiske referencer har ingen type og vælges derfor efter identifier-system. Ikke en FHIR-nøgle: fhir.Practitioner findes nu, men er CPR-nøglet fra SilkeborgData og deler ingen værdier med IFDB's staff-id — en kobling kræver derfor en crosswalk mellem kildesystemerne." }
    activity_timestamp:  { DataType: NVARCHAR(50), FhirPath: "activity.detail.scheduledPeriod.start", Source: [ifdb.IFDB.EVENTMARKER.TIME], Description: "Markørens tidspunkt i IFDB. Ikke oprettelsestidspunktet i EPJ (EPJI_CREATED_DATETIME), som ikke føres med til FHIR." }
    dw_is_deleted:       { DataType: INT, Description: "Slettet-flag (0 = live, 1 = slettet). Warehouse-styret: resourcen baerer ingen urn:fhir:isDeleted-extension, og viewet projicerer ikke feltet. Saettes til 1 af dqa_fhir_server_cleanup naar foraeldre-resourcen er hard-slettet i Aidbox, og af child-grain reconcile naar en markoer forsvinder fra en fortsat levende CarePlan; nulstilles til 0 ved MERGE-match. NOT NULL DEFAULT 0, saa '= 0' betyder 'findes stadig under foraeldren'." }
    last_updated:        { DataType: DATETIME2, FhirPath: "r.ts", Description: "FHIR-tildelt. Tidspunkt for seneste ændring af forløbet på FHIR-serveren (gælder hele forløbet, ikke den enkelte aktivitet); ikke et tidspunkt fra kilden." }
    created_at:          { DataType: DATETIME2, FhirPath: "r.cts", Description: "FHIR-tildelt. Tidspunkt for oprettelsen af forløbet på FHIR-serveren; ikke et tidspunkt fra kilden." }
    dw_ek_Borger:        { Type: FK, DataType: INT, Expr: "dim.Borger.dw_ek_Borger hvor fhir_Patient_id = patient_id", Description: "Borgeren markøren handler om. -1 når patienten ikke findes i dim.Borger. Findes borgeren kun som slettet, peger nøglen stadig på den." }
    dw_sk_Borger:        { Type: FK, DataType: INT, Expr: "dim.Borger.dw_sk_Borger for den levende version, hvor dw_valid_from <= activity_timestamp < dw_valid_to; activity_timestamp læses som det klokkeslæt, IFDB leverer", Description: "Den version af borgeren (adresse m.m.), der gjaldt på markørens tidspunkt. -1 når borgeren eller en gældende version ikke findes, eller når activity_timestamp mangler." }
    dw_ek_Organisation:  { Type: FK, DataType: INT, Expr: "dim.Organisation.dw_ek_Organisation hvor fhir_Organization_id = organization_id", Description: "Markørens administrative enhed. -1 når markøren ikke har en organisation, eller organisationen ikke findes i dim.Organisation." }
