dso_lineage:
  Type: fhir
  TableName: fhir.EpisodeOfCare
  Domain: [FHIR]
  Description: "FHIR EpisodeOfCare ressource — behandlingsforløb fra IFDB"
  Grain: "Én række pr. behandlingsforløb"
  FhirResource: EpisodeOfCare

  SourceSystems:
    - ifdb: [IFDB.EPISODE_OF_CARE, IFDB.HEALTHISSUE]

  Columns:
    episode_of_care_id:          { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", Description: "FHIR resource id (Aidbox UUID) — resolver-/servertildelt ved posting ud fra OBJECT_ID. Findes ikke i kilden; forretningsnøglen (OBJECT_ID) bæres i identifier_value." }
    patient_id:                  { DataType: NVARCHAR(255), FhirPath: "patient.id", FK-Target: fhir.Patient, FK-Key: patient_id, FK-Required: true, Description: "FHIR-tildelt Patient-reference (Aidbox UUID) — resolver-tildelt ved posting ud fra IFDB.EPISODE_OF_CARE.patient_id_ifdb; ikke direkte projiceret fra kilden." }
    managing_organization_id:    { DataType: NVARCHAR(255), FhirPath: "managingOrganization.id", FK-Target: fhir.Organization, FK-Key: organization_id, FK-Required: false, Description: "FHIR-tildelt Organization-reference (Aidbox UUID) — resolver-tildelt ved posting ud fra SOR-kode (IFDB.EPISODE_OF_CARE.MANAGING_ORGANIZATION_SORCODE); ikke direkte projiceret fra kilden." }
    identifier_value:            { DataType: NVARCHAR(255), FhirPath: "identifier.where(system='urn:source:ifdb:episode_of_care_id').value", Source: [ifdb.IFDB.EPISODE_OF_CARE.OBJECT_ID] }
    status:                      { DataType: NVARCHAR(50), FhirPath: "status", Source: [ifdb.IFDB.EPISODE_OF_CARE.STATUS] }
    type_code:                   { DataType: NVARCHAR(255), FhirPath: "type.coding.code" }
    type_display:                { DataType: NVARCHAR(500), FhirPath: "type.coding.display" }
    period_start:                { DataType: NVARCHAR(50), FhirPath: "period.start", Source: [ifdb.IFDB.EPISODE_OF_CARE.PERIOD_START] }
    period_end:                  { DataType: NVARCHAR(50), FhirPath: "period.end", Source: [ifdb.IFDB.EPISODE_OF_CARE.PERIOD_END] }
    previous_episode_of_care_id: { DataType: NVARCHAR(255), FhirPath: "extension.where(url='...previousEpisodeOfCare').valueReference.id", FK-Target: fhir.EpisodeOfCare, FK-Key: episode_of_care_id, FK-Required: false, Description: "FHIR-tildelt EpisodeOfCare-reference (Aidbox UUID) — resolver-tildelt ved posting ud fra IFDB.EPISODE_OF_CARE.PREVIOUS_EOC_ID; ikke direkte projiceret fra kilden." }
    previous_eoc_ref_type_code:  { DataType: NVARCHAR(255), FhirPath: "extension.where(url='urn:source:ifdb:previous_eoc_ref_type_code').valueString", Source: [ifdb.IFDB.EPISODE_OF_CARE.PREVIOUS_EOC_REF_TYPE_CODE] }
    healthissue_id:              { DataType: NVARCHAR(255), FhirPath: "extension.where(url='urn:source:ifdb:healthissue_id').valueString", Source: [ifdb.IFDB.EPISODE_OF_CARE.HEALTHISSUE_ID], FK-None: true, Description: "IFDB kilde-id (healthissue) — ikke en fladtabel-reference." }
    healthissue_code:            { DataType: NVARCHAR(255), FhirPath: "extension.where(url='urn:source:ifdb:healthissue_code').valueCoding.code", Source: [ifdb.IFDB.HEALTHISSUE.HEALTHISSUE_CODE], FK-None: true, Description: "Forløbstype-kode (68 kategorier), opslået via EPISODE_OF_CARE.HEALTHISSUE_ID → HEALTHISSUE.OBJECT_ID." }
    healthissue_text:            { DataType: NVARCHAR(128), FhirPath: "extension.where(url='urn:source:ifdb:healthissue_code').valueCoding.display", Source: [ifdb.IFDB.HEALTHISSUE.HEALTHISSUE_TEXT], FK-None: true, Description: "Display-tekst (1:1 til forløbstype-koden), opslået via EPISODE_OF_CARE.HEALTHISSUE_ID → HEALTHISSUE.OBJECT_ID." }
    discharge_disposition_code:  { DataType: NVARCHAR(255), FhirPath: "extension.where(url='urn:source:ifdb:discharge_disposition_code').valueString", Source: [ifdb.IFDB.EPISODE_OF_CARE.DISCHARGE_DISPOSITION_CODE] }
    dw_is_deleted:                  { DataType: INT, FhirPath: "extension.where(url='urn:fhir:isDeleted').valueInteger" }
    last_updated:                { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:                  { DataType: DATETIME2, FhirPath: "r.cts" }
