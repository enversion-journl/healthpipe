dso_lineage:
  Type: fhir
  TableName: fhir.Patient_Address
  Domain: [FHIR]
  Description: "FHIR Patient.address sidecar — bærer Type 2 historik for borgerens adresser. Én række pr. adresseperiode pr. patient. Dette er den ENESTE FHIR-tabel der bærer historik for borgeren."
  Grain: "Én række pr. (patient_id, address.period.start)"
  FhirResource: Patient
  Profile: "http://hl7.dk/fhir/core/StructureDefinition/dk-core-patient"
  Temporal: period

  Extensions:
    # dk-core officielle
    municipality_code: "http://hl7.dk/fhir/core/StructureDefinition/dk-core-municipalityCodes"
    region_code:       "http://hl7.dk/fhir/core/StructureDefinition/dk-core-RegionalSubDivisionCodes"
    # HL7 international officiel
    address_official:  "http://hl7.org/fhir/StructureDefinition/address-official"
    # region-intern (KVHX/DAR-id har ingen dk-core extension endnu)
    kvhx:              "http://example.org/fhir/StructureDefinition/addressKvhx"

  SourceSystems:
    - ifdb:         [IFDB.PATIENT_OPLYSNINGER_COLUMNA]
    - datafordeler: [CPR.Adresse, CPR.Adressehistorik]      # planlagt — primær kilde for adressehistorik

  SourcePriority: [datafordeler, ifdb]

  Columns:
    patient_id:            { Type: PK, DataType: NVARCHAR(255), FhirPath: "id",                                                                          FK-Target: fhir.Patient, FK-Key: patient_id, FK-Required: true, Description: "FK til fhir.Patient.patient_id" }
    address_period_start:  { Type: PK, DataType: DATETIME2(0),  FhirPath: "address.period.start",                                                        Source: [datafordeler.CPR.Adressehistorik.Tilflytningsdato], Description: "Periodestart — bærer T2-versionen. Normaliseret ved load (normalize_fhir_datetime): FHIR dateTime er en streng, og streng → datetime2(0) er mange-til-én, så nøglen ville hverken være entydig eller stabil som tekst. NOT NULL med sentinel 1900-01-01 = 'start ukendt'. IFDB har ikke historik, så alle IFDB-borgere har sentinelen indtil Datafordeleren leverer historik." }
    address_period_end:    { DataType: DATETIME2(0),  FhirPath: "address.period.end",                                                                    Source: [datafordeler.CPR.Adressehistorik.Fraflytningsdato], Description: "NULL = aktuel adresse (et faktum, ikke en manglende værdi — derfor ingen sentinel her). Normaliseret ved load." }
    address_use:           { DataType: NVARCHAR(20),  FhirPath: "address.use",                                                                           Expr: "'home' for IFDB; Datafordeleren kan levere 'home'/'temp'" }
    address_official:      { DataType: BIT,           FhirPath: "address.extension('http://hl7.org/fhir/StructureDefinition/address-official').valueBoolean", Source: [datafordeler.CPR.Adresse.OfficielAdresse], Description: "Officiel CPR-adresse (HL7 international address-official extension)" }
    address_line:          { DataType: NVARCHAR(500), FhirPath: "address.line.join(', ')",                                                               Source: [datafordeler.CPR.Adresse.Vejnavn, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.VEJ],          Description: "Primær: datafordeler; fallback: IFDB." }
    address_postal_code:   { DataType: NVARCHAR(10),  FhirPath: "address.postalCode",                                                                    Source: [datafordeler.CPR.Adresse.Postnummer, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.POSTNR],   Description: "Primær: datafordeler; fallback: IFDB." }
    address_city:          { DataType: NVARCHAR(255), FhirPath: "address.city",                                                                          Source: [datafordeler.CPR.Adresse.Postdistrikt, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.STEDNAVN], Description: "Primær: datafordeler; fallback: IFDB." }
    address_country:       { DataType: NVARCHAR(8),   FhirPath: "address.country",                                                                       Expr: "Default 'DK' (ISO 3166-1 alpha-2); Datafordeleren kan levere ikke-DK" }
    municipality_code:     { DataType: NVARCHAR(8),   FhirPath: "address.extension('http://hl7.dk/fhir/core/StructureDefinition/dk-core-municipalityCodes').valueCodeableConcept.coding.code",      Source: [datafordeler.CPR.Adresse.Kommunekode, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.KOMMUNEKODE], Description: "Kommunekode (dk-core extension). Primær: datafordeler; fallback: IFDB." }
    region_code:           { DataType: NVARCHAR(8),   FhirPath: "address.extension('http://hl7.dk/fhir/core/StructureDefinition/dk-core-RegionalSubDivisionCodes').valueCodeableConcept.coding.code", Source: [datafordeler.CPR.Adresse.Regionskode],   Description: "Regionskode (dk-core extension) — kommer fra Datafordeleren" }
    kvhx:                  { DataType: NVARCHAR(64),  FhirPath: "address.extension('http://example.org/fhir/StructureDefinition/addressKvhx').valueString",                                  Source: [datafordeler.CPR.Adresse.KVHX],          Description: "Officielt adresse-id (DAR/KVHX) — region-intern extension; kommer fra Datafordeleren" }
    last_updated:          { DataType: DATETIME2,     FhirPath: "meta.lastUpdated" }
    created_at:            { DataType: DATETIME2,     FhirPath: "r.cts" }
    dw_is_deleted:         { DataType: INT,           Description: "Slettet-flag (1 = slettet). Projiceres ikke fra FHIR; sættes af dqa_fhir_server_cleanup og af child-grain reconcile for rækker der ikke længere findes i sof.patient_address_view. NOT NULL DEFAULT 0, så indeksfilter og konsument-prædikater kan skrives som '= 0'." }

  Notes:
    - "Mønster matcher fhir.Encounter_Location (kompositPK + null sentinels på period_start)."
    - "ViewDefinition: 'patient_address_view' med forEachOrNull: address. Address columns removed from patient_view."
    - "MERGE-config (sof_utils.py SOF_RESOURCE_CONFIGS): primary_keys=[patient_id, address_period_start], normalized_datetime_columns=[address_period_start, address_period_end], null_sentinel_columns=[address_period_start], deduplicate_by_pk=True, dedup_tiebreak_columns=[last_updated, address_period_end]."
    - "IFDB bærer ingen adressehistorik: arc.ifdb_patient er UPSERT på PATIENT_ID, så en flytning overskriver den forrige adresse. Derfor er address.period.start hardcodet til 1900-01-01 ('nuværende adresse, start ukendt'), og T2-versioneringen er degenereret indtil Datafordeleren leverer historik."
    - "Adressebeskyttede borgere bærer adressen som fakta plus flaget fhir.Patient.address_protection. Undertrykkelse sker i sikkerhedsmodellen ved forespørgsel, ikke i transformen."
    - "Indtil Datafordeler-leveringen kører, har vi kun én adresse pr. patient (fra IFDB) — det er stadig OK; T2 aktiveres automatisk når Datafordeler-historik kommer ind."
    - "address.district er bevidst IKKE medtaget — KOMMUNEKODE leveres via dk-core municipality_code-extension i stedet (mere standardiseret)."
    - "dw_sk_Borger-tildeling: Sker IKKE i denne tabel. ref.Patient_Address_To_Borger er INT-IDENTITY-tabellen oven på dette view. Den læser hver række her, kæder dem sammen i ikke-overlappende half-open [dw_valid_from, dw_valid_to)-intervaller (LEAD over address_period_start, ingen -1 sekund offset), og fungerer som SCD2-lookup for fact-tabeller på (patient_id, event_date)."
    - "Default-Dato-håndtering for IFDB-only borgere: ref.Patient_Address_To_Borger skriver address_period_start = '1900-01-01' når kilden ikke har en konkret start. Når en rigtig address.period.start senere lander fra Datafordeleren for samme patient, soft-deletes ref-tabellen default-rækken (via MERGE NOT MATCHED BY SOURCE) så vi ikke får overlappende T2-versioner. Selve default-konstanten og MERGE-logikken bor i DSA/SQL/ref/patient_address_borger.py."
    - "Non-overlap-garanti: address_period_start STYRER intervallerne i ref.Patient_Address_To_Borger. address_period_end indgår ikke i beregningen af dw_valid_to — dw_valid_to = LEAD(address_period_start) giver half-open [dw_valid_from, dw_valid_to) intervaller (ingen -1 sekund offset), så fact-lookup med event_date >= dw_valid_from AND event_date < dw_valid_to altid rammer præcis én række selv ved overlappende kildedata."
