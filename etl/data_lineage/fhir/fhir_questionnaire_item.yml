dso_lineage:
  Type: fhir
  TableName: fhir.Questionnaire_item
  Domain: [FHIR]
  Description: "Elementerne i et SFI-skema: én række pr. spørgsmål eller felt i en Questionnaire. Child-tabel til fhir.Questionnaire i eget grain."
  Grain: "Én række pr. (skema, SFI-kode, forekomst) — PK: questionnaire_id + link_id + item_key"
  FhirResource: Questionnaire

  SourceSystems:
    - ifdb_aktivitetsresultat: [IFDB.AKTIVITETSRESULTAT]

  # Kolonner projiceret af SoF-viewet questionnaire_item_view; FhirPath som i viewet,
  # relativt til forEach item for element-kolonnerne;
  # rækkefølge/typer følger infrastructure/ddl/tables/fhir/01_tables.sql.
  Columns:
    questionnaire_id:      { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", FK-Target: fhir.Questionnaire, FK-Key: questionnaire_id, FK-Required: true, Description: "Første led i den sammensatte nøgle og fremmednøgle til skemaet." }
    questionnaire_url:     { DataType: NVARCHAR(500), FhirPath: "url" }
    questionnaire_version: { DataType: NVARCHAR(100), FhirPath: "version", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSVERSION] }
    link_id:               { Type: PK, DataType: NVARCHAR(255), FhirPath: "linkId", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML, ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSNAVN], Description: "SFI-koden (Skema.FeltId). Samme værdi som link_id i fhir.QuestionnaireResponse_item og element_code i fhir.SFI_datapoint." }
    item_key:              { Type: PK, DataType: NVARCHAR(100), FhirPath: "id", Description: "Skiller gentagne forekomster af samme SFI-kode i skemaet ad." }
    text:                  { DataType: NVARCHAR(MAX), FhirPath: "text", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML], Description: "Ledeteksten, som skemaet viser den." }
    item_type:             { DataType: NVARCHAR(50), FhirPath: "type", Description: "FHIR-elementtype (fx integer, decimal, string, choice, group)." }
    repeats:               { DataType: NVARCHAR(10), FhirPath: "repeats" }
    element_system:        { DataType: NVARCHAR(500), FhirPath: "code.where(system='urn:dk:ifdb:sfi').system.first()", Expr: "Konstant urn:dk:ifdb:sfi." }
    element_code:          { DataType: NVARCHAR(255), FhirPath: "code.where(system='urn:dk:ifdb:sfi').code.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML, ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSNAVN] }
    element_display:       { DataType: NVARCHAR(500), FhirPath: "code.where(system='urn:dk:ifdb:sfi').display.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    last_updated:          { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:            { DataType: DATETIME2, FhirPath: "r.cts" }
    dw_is_deleted:         { DataType: INT, Description: "Slettet-flag (0 = live, 1 = slettet). Warehouse-styret: sættes kun af dqa_fhir_server_cleanup, når skemaet slettes i Aidbox, og nulstilles ved MERGE-match. Et element, der forsvinder fra et levende skema, bliver stående med 0. NOT NULL DEFAULT 0." }

  Notes:
    - "Skemaet samles af de elementer, der er set i aktivitetsresultaterne, og kan derfor mangle elementer, som ingen har udfyldt. Brug det til at slå ledetekster og struktur op, ikke som filter på svar: fhir.SFI_datapoint joiner bevidst ikke hertil."
