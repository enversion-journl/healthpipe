dso_lineage:
  Type: fhir
  TableName: fhir.Observation
  Domain: [FHIR]
  Description: "FHIR Observation-ressource — kuraterede SFI-målinger fra IFDB"
  Grain: "Én række pr. SFI-element med godkendt målerute og læsbar, ikke-tom værdi"
  FhirResource: Observation

  SourceSystems:
    - ifdb_aktivitetsresultat: [IFDB.AKTIVITETSRESULTAT]
    - meta_ifdb_aktivitetstype_routing: [meta.IFDBAktivitetstypeRouting]

  # Kolonner projiceret ned i den flade fhir.Observation DWH-tabel af SoF-viewet
  # observation_view (rækkefølge/typer følger infrastructure/ddl/tables/fhir/01_tables.sql).
  Columns:
    observation_id:        { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", Description: "FHIR resource-id; den stabile forretningsnøgle er ifdb_aktivitet_sfi_id." }
    patient_id:            { DataType: NVARCHAR(255), FhirPath: "subject.id", FK-Target: fhir.Patient, FK-Key: patient_id, FK-Required: true, Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.PATIENT_ID], Description: "Resolveret FHIR-reference til patienten." }
    encounter_id:          { DataType: NVARCHAR(255), FhirPath: "encounter.id", FK-Target: fhir.Encounter, FK-Key: encounter_id, FK-Required: false, Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.ENCOUNTER_ID], Description: "Resolveret FHIR-reference til kontakten." }
    organization_id:       { DataType: NVARCHAR(255), FhirPath: "performer.getReferenceKey(Organization)", FK-Target: fhir.Organization, FK-Key: organization_id, FK-Required: false }
    practitioner_id:       { DataType: NVARCHAR(255), FhirPath: "performer.where(type='Practitioner').identifier.value.first()", FK-None: true, Description: "Behandler-identifikatorværdi (ingen fhir.Practitioner-fladtabel endnu)." }
    practitioner_display:  { DataType: NVARCHAR(500), FhirPath: "performer.where(type='Practitioner').display.first()" }
    status:                { DataType: NVARCHAR(50), FhirPath: "status" }
    category_code:         { DataType: NVARCHAR(255), FhirPath: "category.coding.code.first()", Source: [meta_ifdb_aktivitetstype_routing.meta.IFDBAktivitetstypeRouting.observation_category], Description: "Målekategori fra den aktive rute, ikke fra aktivitetstypen." }
    code:                  { DataType: NVARCHAR(255), FhirPath: "code.coding.code.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML, ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSNAVN], Description: "SFI-elementets skemakode." }
    code_system:           { DataType: NVARCHAR(500), FhirPath: "code.coding.system.first()", Expr: "Konstant urn:dk:ifdb:sfi." }
    code_display:          { DataType: NVARCHAR(500), FhirPath: "code.coding.display.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    element_system:        { DataType: NVARCHAR(500), FhirPath: "code.coding.where(system='urn:dk:ifdb:sfi').system.first()", Expr: "Konstant urn:dk:ifdb:sfi." }
    element_code:          { DataType: NVARCHAR(255), FhirPath: "code.coding.where(system='urn:dk:ifdb:sfi').code.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML, ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSNAVN] }
    element_display:       { DataType: NVARCHAR(500), FhirPath: "code.coding.where(system='urn:dk:ifdb:sfi').display.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    effective_date:        { DataType: NVARCHAR(50), FhirPath: "effectiveDateTime", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.PERIOD_START], Description: "Kun sat når PERIOD_END mangler; ved en periode er kolonnen tom." }
    value_type:            { DataType: NVARCHAR(50), FhirPath: "'fhir_value'", Expr: "SoF-udledt indikator for hvilket FHIR value[x]-felt der er sat." }
    value_int:             { DataType: NVARCHAR(50), FhirPath: "valueInteger", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    value_dec:             { DataType: NVARCHAR(50), FhirPath: "valueDecimal", Expr: "Observation bruger aldrig valueDecimal; decimaler projiceres som valueQuantity.value." }
    value_string:          { DataType: NVARCHAR(MAX), FhirPath: "valueString", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    value_datetime:        { DataType: NVARCHAR(50), FhirPath: "valueDateTime", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    value_bool:            { DataType: NVARCHAR(10), FhirPath: "valueBoolean", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    value_quantity:        { DataType: NVARCHAR(100), FhirPath: "valueQuantity.value", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML], Description: "Decimaler og mængder; FHIR Observation har ikke valueDecimal." }
    value_unit:            { DataType: NVARCHAR(100), FhirPath: "valueQuantity.unit", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    value_coding_system:   { DataType: NVARCHAR(500), FhirPath: "valueCodeableConcept.coding.system.first()", Expr: "Ikke sat af den aktuelle SFI-builder." }
    value_coding_code:     { DataType: NVARCHAR(255), FhirPath: "valueCodeableConcept.coding.code.first()", Expr: "Ikke sat af den aktuelle SFI-builder." }
    value_coding_display:  { DataType: NVARCHAR(500), FhirPath: "valueCodeableConcept.coding.display.first()", Expr: "Ikke sat af den aktuelle SFI-builder." }
    ifdb_aktivitet_id:     { DataType: NVARCHAR(255), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='aktivitetId').valueString.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.OBJEKT_ID], FK-None: true }
    ifdb_aktivitet_sfi_id: { DataType: NVARCHAR(255), FhirPath: "identifier.where(system='urn:source:ifdb:aktivitetsresultat_sfi').value.first()", Expr: "Normaliseret OBJEKT_ID og element_nummer.", FK-None: true }
    element_nummer:        { DataType: NVARCHAR(50), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='elementNummer').valueInteger.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    klynge_id:             { DataType: NVARCHAR(50), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='klyngeId').valueInteger.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML], FK-None: true }
    klynge_id_hierarki:    { DataType: NVARCHAR(500), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='klyngeIdHierarki').valueString.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    klynge_valg_ledetekst: { DataType: NVARCHAR(MAX), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='klyngeValgLedetekst').valueString.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    klynge_parent_id:      { DataType: NVARCHAR(50), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='klyngeParentId').valueInteger.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML], FK-None: true }
    repetition_id:         { DataType: NVARCHAR(50), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='repetitionId').valueInteger.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML], FK-None: true }
    element_kode:          { DataType: NVARCHAR(255), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='elementKode').valueString.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    element_original_kode: { DataType: NVARCHAR(255), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='elementOriginalKode').valueString.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    element_administrativ_enhed_id: { DataType: NVARCHAR(255), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='elementAdminEnhedId').valueString.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML], FK-None: true }
    repetition_id_hierarki: { DataType: NVARCHAR(500), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='repetitionIdHierarki').valueString.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    opdateret_tid:         { DataType: NVARCHAR(50), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='opdateretTid').valueString.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    xml_status:            { DataType: INT, FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='xmlStatus').valueInteger.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    xml_status_text:       { DataType: NVARCHAR(255), FhirPath: "extension.where(url='http://example.org/fhir/StructureDefinition/sfiInstanceMeta').extension.where(url='xmlStatusText').valueString.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.XML] }
    dw_is_deleted:         { DataType: INT, FhirPath: "extension('urn:fhir:isDeleted').valueInteger.first()", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.SLETTET], Description: "Slettet-flag (1 = slettet) fra kildens deletion-markør. NOT NULL DEFAULT 0; manglende extension coalesces til 0 i loadet." }
    last_updated:          { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:            { DataType: DATETIME2, FhirPath: "r.cts" }
    dw_timestamp_effective: { Type: Audit, DataType: DATETIME2, Expr: "ISNULL(dw_timestamp_update, dw_timestamp_insert) PERSISTED — sargbar delta-discovery-kolonne" }
