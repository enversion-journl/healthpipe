dso_lineage:
  Type: fhir
  TableName: fhir.Questionnaire
  Domain: [FHIR]
  Description: "FHIR Questionnaire ressource — SFI-modeldefinitioner (skemaer) fra IFDB"
  Grain: "Én række pr. Questionnaire (unik IFDB-model: MODELLERINGSNAVN + MODELLERINGSVERSION)"
  FhirResource: Questionnaire

  SourceSystems:
    - ifdb_aktivitetsresultat: [IFDB.AKTIVITETSRESULTAT]

  # Kolonner projiceret ned i den flade fhir.Questionnaire DWH-tabel af SoF-viewet
  # questionnaire_view (rækkefølge/typer følger infrastructure/ddl/tables/fhir/01_tables.sql).
  Columns:
    questionnaire_id:      { Type: PK, DataType: NVARCHAR(255), FhirPath: "id" }
    url:                   { DataType: NVARCHAR(500), FhirPath: "url" }
    version:               { DataType: NVARCHAR(100), FhirPath: "version", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSVERSION] }
    status:                { DataType: NVARCHAR(50), FhirPath: "status" }
    name:                  { DataType: NVARCHAR(500), FhirPath: "name", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSNAVN] }
    title:                 { DataType: NVARCHAR(500), FhirPath: "title", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSNAVN] }
    date:                  { DataType: NVARCHAR(50), FhirPath: "date" }
    publisher:             { DataType: NVARCHAR(500), FhirPath: "publisher" }
    source_model_name:     { DataType: NVARCHAR(255), FhirPath: "name", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSNAVN] }
    source_model_version:  { DataType: NVARCHAR(100), FhirPath: "version", Source: [ifdb_aktivitetsresultat.IFDB.AKTIVITETSRESULTAT.MODELLERINGSVERSION] }
    dw_is_deleted:         { DataType: INT, Description: "Slettet-flag (0 = live, 1 = slettet). Warehouse-styret: resourcen baerer ingen urn:fhir:isDeleted-extension, og viewet projicerer ikke feltet. Saettes kun af dqa_fhir_server_cleanup og nulstilles ved MERGE-match. NOT NULL DEFAULT 0, saa konsumenter kan skrive '= 0' ensartet paa tvaers af alle fhir.*-tabeller." }
    last_updated:          { DataType: DATETIME2, FhirPath: "r.ts" }
    created_at:            { DataType: DATETIME2, FhirPath: "r.cts" }

  Notes:
    - "Én Questionnaire pr. unik IFDB-model (MODELLERINGSNAVN|MODELLERINGSVERSION). SFI-koden lever FHIR-nativt på Questionnaire.item.code[]; de flade item-rækker ligger i fhir.Questionnaire_item (intern child-tabel, ikke en selvstændig lineage-ressource)."
