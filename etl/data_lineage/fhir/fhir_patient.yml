dso_lineage:
  Type: fhir
  TableName: fhir.Patient
  Domain: [FHIR]
  Description: "FHIR Patient ressource — dk-core compliant. Type 1 (én aktuel række pr. patient). adresse-historik (Type 2) ligger i fhir.Patient_Address."
  Grain: "Én række pr. patient (patient_id)"
  FhirResource: Patient
  Profile: "http://hl7.dk/fhir/core/StructureDefinition/dk-core-patient"

  Extensions:
    # dk-core officielle
    municipality_code:  "http://hl7.dk/fhir/core/StructureDefinition/dk-core-municipalityCodes"
    region_code:        "http://hl7.dk/fhir/core/StructureDefinition/dk-core-RegionalSubDivisionCodes"
    # HL7 international officielle (foretrækkes over interne)
    address_official:   "http://hl7.org/fhir/StructureDefinition/address-official"
    citizenship:        "http://hl7.org/fhir/StructureDefinition/patient-citizenship"
    mothers_maiden_name: "http://hl7.org/fhir/StructureDefinition/patient-mothersMaidenName"
    # region-interne (kun hvor ingen standard findes)
    modtidspunkt:       "http://example.org/fhir/StructureDefinition/modtidspunkt"
    address_protection: "http://example.org/fhir/StructureDefinition/address-protection"
    residence_municipality: "http://example.org/fhir/StructureDefinition/residenceMunicipality"
    discretion_flag:    "http://example.org/fhir/StructureDefinition/discretionFlag"
    district:           "http://example.org/fhir/StructureDefinition/district"
    social_district:    "http://example.org/fhir/StructureDefinition/social-district"
    # Faelles warehouse-markoer paa tvaers af resourcer -- ikke en region
    # StructureDefinition, derfor urn:-skemaet (utils/fhir/is_deleted_extension.py).

    dw_is_deleted:      "urn:fhir:isDeleted"
    mother_identifier:  "http://example.org/fhir/StructureDefinition/motherIdentifier"  # mor-CPR (alternativ: Patient.link → RelatedPerson)
    father_identifier:  "http://example.org/fhir/StructureDefinition/fatherIdentifier"  # far-CPR (alternativ: Patient.link → RelatedPerson)

  SourceSystems:
    - ifdb:         [IFDB.PATIENT_OPLYSNINGER_COLUMNA]
    - datafordeler: [CPR.Person, CPR.Adresse]  # CPR-registerets filudtræk. Indeholder IKKE Sundhedskort — ingen egen læge
    - haiba:             [cases_infektion, cases_ssi]                   # leverer kun personnummer (stubs)
    - sds_drg:           [DRG.DRGKONTAKT, DRGPSYK.Psyk_kontakt]         # leverer kun personnummer (stubs)
    - sds_udredningsret: [LPR_Udredningsret.UdredningsretMont]          # leverer kun personnummer (stubs)

  SourcePriority: [datafordeler, ifdb]

  Columns:
    # ------------------------------------------------------------------
    # Identifiers (dk-core slices)
    # ------------------------------------------------------------------
    patient_id:                { Type: PK,  DataType: NVARCHAR(255), FhirPath: "id",                                                                       Description: "FHIR resource id (Aidbox) — kanonisk borger-identitet. Mappes til INT-surrogatet dw_ek_Borger via ref.PatientToBorger." }
    patient_ssn:               { DataType: NVARCHAR(10),  FhirPath: "identifier.where(system='urn:dk:cpr').value",                            Source: [datafordeler.CPR.Person.Personnummer, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.CPR, haiba.cases_infektion.cprnr, haiba.cases_ssi.cprnr, sds_drg.DRG.DRGKONTAKT.CPR, sds_drg.DRGPSYK.Psyk_kontakt.CPRnummer, sds_udredningsret.LPR_Udredningsret.UdredningsretMont.CPR],           Description: "Aktuelt CPR (dk-core slice 'cpr' — system: identifier_systems.SYSTEM_CPR). Primær: datafordeler; fallback: IFDB indtil leveringen er stabil. Registerkilderne HAIBA, DRG og udredningsret leverer kun personnummeret (stub-ressourcer)." }
    previous_ssn:              { DataType: NVARCHAR(10),  FhirPath: "identifier.where(system='urn:dk:cpr' and use='old').value",              Source: [datafordeler.CPR.Person.TidligerePersonnummer], Description: "Forrige CPR ved CPR-skifte (identifier m. use='old' inden for cpr-slice). Kun CPR-registeret (recordtype 022) — EPJ-transformen mapper ikke TIDLIGERE_CPR, så IFDB er ikke en kilde." }
    x_ecpr:                    { DataType: NVARCHAR(50),  FhirPath: "identifier.where(system='urn:oid:1.2.208.176.1.5.X').value",                         Source: [datafordeler.CPR.Person.XECPR],                                                             Description: "Nationalt erstatnings-CPR (dk-core slice 'x-ecpr' — system: identifier_systems.SYSTEM_X_ECPR). Datafordeler/IFDB — afventer leverance." }
    d_ecpr:                    { DataType: NVARCHAR(50),  FhirPath: "identifier.where(system='urn:oid:1.2.208.176.1.5.D').value",                         Source: [datafordeler.CPR.Person.DECPR],                                                             Description: "Regional/decentralt erstatnings-CPR (dk-core slice 'd-ecpr' — system: identifier_systems.SYSTEM_D_ECPR). Datafordeler/IFDB — afventer leverance." }
    ifdb_patient_id:           { DataType: NVARCHAR(255), FhirPath: "identifier.where(system='urn:source:ifdb:patient_id').value",                Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.PATIENT_ID],    FK-None: true, Description: "IFDB patient_id (system: identifier_systems.SYSTEM_IFDB_PATIENT_ID) — bevares som ekstra identifier til staging-joins; kilde-id, ikke en fladtabel-reference." }

    # ------------------------------------------------------------------
    # Status (dk-core: Patient.active, Patient.deceased)
    # ------------------------------------------------------------------
    active:                    { DataType: BIT,           FhirPath: "active",                                  Source: [datafordeler.CPR.Person.Status, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.PERSON_STATUSKODE], Expr: "CPR's statuskode: 01, 03, 05 og 07 er aktive; 20-90 er inaktive (80 = udrejst, 90 = død). Primær: datafordeler; fallback: IFDB." }
    deceased:                  { DataType: BIT,           FhirPath: "deceasedBoolean",                         Source: [datafordeler.CPR.Person.Status, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.PERSON_STATUSKODE], Expr: "true ved CPR's statuskode 90 (død). Primær: datafordeler; fallback: IFDB." }

    # ------------------------------------------------------------------
    # Name (dk-core slice 'official' — cardinality 0..1, fladet ud)
    # ------------------------------------------------------------------
    name_use:                  { DataType: NVARCHAR(20),  FhirPath: "name.where(use='official').use",          Expr: "Konstant 'official'" }
    name_given:                { DataType: NVARCHAR(500), FhirPath: "name.where(use='official').given.join(' ')", Source: [datafordeler.CPR.Person.Fornavne, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.FORNAVNE], Description: "Primær: datafordeler; fallback: IFDB. Tom for en borger med navne- og adressebeskyttelse." }
    name_family:               { DataType: NVARCHAR(255), FhirPath: "name.where(use='official').family",       Source: [datafordeler.CPR.Person.Efternavn, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.EFTERNAVN], Description: "Primær: datafordeler; fallback: IFDB. 'Navnebeskyttet' for en borger med navne- og adressebeskyttelse." }
    name_text:                 { DataType: NVARCHAR(500), FhirPath: "name.where(use='official').text",         Source: [datafordeler.CPR.Person.Adresseringsnavn], Description: "Adresseringsnavn (typisk det navn der står på post). 'Navnebeskyttet' for en borger med navne- og adressebeskyttelse." }

    # ------------------------------------------------------------------
    # Demografi (dk-core: gender, birthDate)
    # ------------------------------------------------------------------
    gender:                    { DataType: NVARCHAR(20),  FhirPath: "gender",                                  Source: [datafordeler.CPR.Person.Koen, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.KOEN_KODE], Expr: "Map M→male, K→female; aktuelt køn (juridisk skifte respekteret). Primær: datafordeler; fallback: IFDB." }
    birth_date:                { DataType: DATE,          FhirPath: "birthDate",                               Source: [datafordeler.CPR.Person.Foedselsdato, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.FOEDSELSDATO], Description: "Primær: datafordeler; fallback: IFDB." }

    # ------------------------------------------------------------------
    # Civilstand (dk-core: maritalStatus — Type 1, ingen periode i dim.Borger)
    # ------------------------------------------------------------------
    marital_status_code:       { DataType: NVARCHAR(8),   FhirPath: "maritalStatus.coding.code",               Source: [datafordeler.CPR.Person.Civilstand],     Description: "Civilstanden efter dk-core: HL7 v3 MaritalStatus (U, M, D, W) eller dk-core's egne koder (P, O). CPR's D (død) giver ingen civilstand." }
    marital_status_display:    { DataType: NVARCHAR(100), FhirPath: "maritalStatus.text",                      Source: [datafordeler.CPR.Person.CivilstandTekst], Description: "CPR's egen betegnelse for civilstanden (ugift, gift, fraskilt, enke eller enkemand, registreret partnerskab, ophævet partnerskab, længstlevende partner). Død er ikke en civilstand; den står i deceased." }

    # ------------------------------------------------------------------
    # General practitioner (dk-core slice — egen læge)
    # ------------------------------------------------------------------
    gp_display:                { DataType: NVARCHAR(500), FhirPath: "generalPractitioner.display",                                                          Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.LAEGENAVN], Description: "Kun IFDB — CPR-registerets filudtræk indeholder ingen læge- eller sundhedskortoplysninger." }
    gp_identifier:             { DataType: NVARCHAR(50),  FhirPath: "generalPractitioner.identifier.where(system='urn:oid:1.2.208.176.1.4').value",                     Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.LAEGENUMMER], Description: "Ydernummer (system: identifier_systems.SYSTEM_YDERNUMMER). Kun IFDB — filudtrækket fra CPR-registeret har ingen egen læge." }

    # ------------------------------------------------------------------
    # statsborgerskab (HL7 international extension patient-citizenship)
    # ------------------------------------------------------------------
    citizenship_code:          { DataType: NVARCHAR(8),   FhirPath: "extension('http://hl7.org/fhir/StructureDefinition/patient-citizenship').extension('code').valueCodeableConcept.coding.code",    Source: [datafordeler.CPR.Person.Statsborgerskab],     Description: "Datafordeler — planlagt; ISO 3166-1 alpha-2/3" }
    citizenship_display:       { DataType: NVARCHAR(255), FhirPath: "extension('http://hl7.org/fhir/StructureDefinition/patient-citizenship').extension('code').valueCodeableConcept.coding.display", Source: [datafordeler.CPR.Person.StatsborgerskabTekst] }

    # ------------------------------------------------------------------
    # Familierelationer (region-interne extensions; alternativ: Patient.link → RelatedPerson)
    # ------------------------------------------------------------------
    mother_ssn:                { DataType: NVARCHAR(10),  FhirPath: "extension('http://example.org/fhir/StructureDefinition/motherIdentifier').valueIdentifier.value", Source: [datafordeler.CPR.Person.MorCPR],   Description: "Datafordeler — planlagt; intern extension — final modeling (extension vs Patient.link) afventer beslutning" }
    father_ssn:                { DataType: NVARCHAR(10),  FhirPath: "extension('http://example.org/fhir/StructureDefinition/fatherIdentifier').valueIdentifier.value", Source: [datafordeler.CPR.Person.FarCPR],   Description: "Datafordeler — planlagt; samme overvejelse som mother_ssn" }

    # ------------------------------------------------------------------
    # Privacy / kontekst (region-interne extensions + meta)
    # ------------------------------------------------------------------
    address_protection:        { DataType: BIT,           FhirPath: "extension('http://example.org/fhir/StructureDefinition/address-protection').valueBoolean", Source: [datafordeler.CPR.Person.Adressebeskyttelse, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.HAR_ADRESSEBESKYTTELSE], Expr: "1 = navne- og adressebeskyttelse (CPR-registerets beskyttelsestype 1) gælder i dag; 0 when the extension is absent. NOT NULL DEFAULT 0. Et ja fra enten datafordeler eller IFDB sætter flaget, også når den anden kilde siger nej. Lokalvejviser- og markedsføringsbeskyttelse (type 2 og 3) sætter ikke flaget." }
    municipality_code:         { DataType: NVARCHAR(8),   FhirPath: "extension('http://example.org/fhir/StructureDefinition/residenceMunicipality').valueCodeableConcept.coding.code", Source: [datafordeler.CPR.Adresse.Kommunekode, ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.KOMMUNEKODE], Description: "Kommunekoden på borgerens gældende adresse, firecifret. Sættes også for en borger med navne- og adressebeskyttelse, hvor adressen selv er erstattet af standardteksten. NULL for en borger uden gældende adresse." }
    discretion_flag:           { DataType: BIT,           FhirPath: "extension('http://example.org/fhir/StructureDefinition/discretionFlag').valueBoolean",    Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.OENSKER_DISKRETION] }
    medcom_test_person:        { DataType: BIT,           FhirPath: "meta.tag.where(code='test').exists()",    Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.MEDCOM_TESTPERSON],                                     Description: "Tagget som testperson via meta.tag" }

    # ------------------------------------------------------------------
    # Distrikt (region lokale ekstensioner — ikke i dk-core)
    # ------------------------------------------------------------------
    district_code:             { DataType: NVARCHAR(20),  FhirPath: "extension('http://example.org/fhir/StructureDefinition/district').extension('code').valueString",       Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.PERSON_DISTRIKTKODE] }
    district_text:             { DataType: NVARCHAR(100), FhirPath: "extension('http://example.org/fhir/StructureDefinition/district').extension('text').valueString",       Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.PERSON_DISTRIKTKODETEKST] }
    social_district_code:      { DataType: NVARCHAR(32),  FhirPath: "extension('http://example.org/fhir/StructureDefinition/social-district').extension('code').valueString", Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.PERSON_SOCIALDISTRIKTKODE] }
    social_district_text:      { DataType: NVARCHAR(100), FhirPath: "extension('http://example.org/fhir/StructureDefinition/social-district').extension('text').valueString", Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.PERSON_SOCIALDISTRIKTKODETEKST] }

    # ------------------------------------------------------------------
    # Audit (meta + region-interne)
    # ------------------------------------------------------------------
    modtidspunkt:              { DataType: DATETIME2,     FhirPath: "extension('http://example.org/fhir/StructureDefinition/modtidspunkt').valueDateTime", Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.MODTIDSPUNKT] }
    cpr_updated:               { DataType: DATE,          FhirPath: "extension('http://example.org/fhir/StructureDefinition/cprUpdated').valueDate", Source: [datafordeler.CPR.Person.Produktionsdato], Description: "Produktionsdatoen på den seneste CPR-leverance, der ændrede registrets felter på borgeren. Skrives sammen med felterne. NULL for en borger, registret ikke kender." }
    # ------------------------------------------------------------------
    # Proveniens (meta) — hvem bidrog til denne borger
    #
    # Ressourcen samles af DSA/FHIR/Patient/patient_builder.py ud fra ét bidrag pr. kilde,
    # og feltejerskabet står i DSA/FHIR/Patient/field_ownership.py. Kolonnerne herunder har derfor
    # ingen Source: de beskriver ikke, hvad en kilde leverer, men hvem der bidrog.
    # ------------------------------------------------------------------
    meta_source:               { DataType: NVARCHAR(255), FhirPath: "meta.source",                                                    Description: "Byggerens URI. NULL på ressourcer, der ikke er bygget om siden kolonnen kom til." }
    source_cpr:                { DataType: BIT,           FhirPath: "meta.tag.where(system='http://example.org/fhir/CodeSystem/kilde' and code='CPR').exists()",    Description: "CPR-registeret bidrog til denne borger." }
    source_ifdb:               { DataType: BIT,           FhirPath: "meta.tag.where(system='http://example.org/fhir/CodeSystem/kilde' and code='IFDB').exists()",   Description: "EPJ bidrog til denne borger." }
    source_haiba:              { DataType: BIT,           FhirPath: "meta.tag.where(system='http://example.org/fhir/CodeSystem/kilde' and code='HAIBA').exists()",  Description: "HAIBA bidrog — i dag kun personnummeret (stub)." }
    source_sdsdrg:             { DataType: BIT,           FhirPath: "meta.tag.where(system='http://example.org/fhir/CodeSystem/kilde' and code='SDSDRG').exists()", Description: "DRG-leverancerne bidrog — i dag kun personnummeret (stub)." }
    source_sdsudred:           { DataType: BIT,           FhirPath: "meta.tag.where(system='http://example.org/fhir/CodeSystem/kilde' and code='SDSUDRED').exists()", Description: "Udredningsret-leverancerne bidrog — i dag kun personnummeret (stub)." }
    dw_is_deleted:                { DataType: INT,           FhirPath: "extension('urn:fhir:isDeleted').valueInteger",     Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.SLETTET], Expr: "1 = blød slettet i kilden" }
    last_updated:              { DataType: DATETIME2,     FhirPath: "meta.lastUpdated",                        Source: [ifdb.IFDB.PATIENT_OPLYSNINGER_COLUMNA.OPDATERET_TID] }
    created_at:                { DataType: DATETIME2,     FhirPath: "r.cts" }

  Notes:
    - "Identifier-systemer (cpr, x_ecpr, d_ecpr, ifdb_patient_id, ydernummer) defineres centralt i etl/utils/fhir/identifier_systems.py. FhirPath bruger literal URIs (fx system='urn:dk:cpr'). Placeholder-konventionen er retired — alle referencer er erstattet med fulde URIs."
    - "Identifier-constraint: Mindst én af patient_ssn (cpr) / x_ecpr / d_ecpr skal være sat pr. patient. Constraint håndhæves af ref.PatientToBorger, ikke her — fhir.Patient er en ren projektion af FHIR-ressourcen og må gerne have alle tre NULL midlertidigt."
    - "fhir.Patient er Type 1: én række pr. patient_id. Hvis demografisk historik (navn, gender, GP) bliver påkrævet, modelleres det i sidecars (fhir.Patient_Name etc.) eller via meta.versionId — IKKE som T2-versioner i dim.Borger."
    - "adresse-historik (Type 2) ligger i fhir.Patient_Address — én row pr. (patient_id, address.period.start). dw_sk_Borger-tildeling og non-overlap-håndtering af perioder lever i ref.Patient_Address_To_Borger."
    - "ViewDefinition patient_view — address projection lives in patient_address_view. Identifiers (cpr/x_ecpr/d_ecpr) are projected as wide columns directly in patient_view; ref.PatientToBorger reads them from fhir.Patient."
    - "Kilde-prioritet: datafordeler > ifdb. Ved overlap vinder Datafordeleren. IFDB bevares som fallback indtil Datafordeler-leveringen er stabil."
    - "Navne- og adressebeskyttelse: når address_protection = 1, skrives ressourcen med standardteksterne 'Navnebeskyttet' og 'Adressebeskyttet' i stedet for navn og adresser. municipality_code er det eneste, der er tilbage af adressen."
    - "FRT (felt-rationalisering) ift. dk-core: alle felter bruger officielle dk-core/HL7 systems og extensions hvor de eksisterer. region-interne extensions er kun anvendt for felter uden FHIR-standard (familie-CPR, address-protection, region-distrikt, MODTIDSPUNKT). dw_is_deleted læses fra urn:fhir:isDeleted — et fælles warehouse-slettet-flag, ikke en region StructureDefinition."
