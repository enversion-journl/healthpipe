dso_lineage:
  Type: fhir
  TableName: fhir.CarePlan
  Domain: [FHIR]
  Description: "FHIR CarePlan — alle markørforløb"
  Grain: "Én række pr. behandlingsplan (markørforløb) pr. patient"
  FhirResource: CarePlan

  SourceSystems:
    - ifdb: [IFDB.EVENTMARKER]

  Columns:
    careplan_id:      { Type: PK, DataType: NVARCHAR(255), FhirPath: "id", Description: "FHIR-tildelt id for patientens markørforløb. Tildelt af FHIR-serveren; ikke et id fra kilden." }
    patient_id:       { DataType: NVARCHAR(255), FhirPath: "subject.getReferenceKey(Patient)", FK-Target: fhir.Patient, FK-Key: patient_id, FK-Required: true, Source: [ifdb.IFDB.EVENTMARKER.PATIENT_ID], Description: "FHIR-tildelt Patient-reference (Aidbox UUID) — resolver-tildelt ved posting ud fra IFDB.EVENTMARKER.PATIENT_ID; ikke direkte projiceret fra kilden." }
    status:           { DataType: NVARCHAR(50), FhirPath: "status", Expr: "Konstant 'active'", Description: "FHIR-tildelt. Altid 'active': markørforløbet består for patienten, også når alle markører er slettet i IFDB. Siger ikke, om patienten er i et igangværende forløb." }
    intent:           { DataType: NVARCHAR(50), FhirPath: "intent", Expr: "Konstant 'plan'", Description: "FHIR-tildelt. Altid 'plan'. Feltet er påkrævet i FHIR og bærer ingen information fra kilden." }
    category_code:    { DataType: NVARCHAR(100), FhirPath: "category[0].coding[0].code", Expr: "Konstant 'alle_markoerer'", Description: "FHIR-tildelt. Altid 'alle_markoerer' i system http://example.org/fhir/CodeSystem/patient-rights-type. De oevrige patientrettighedskategorier (kraeftpakke, udredningsret, behandlingsret, maksimale ventetider) havde ingen producent i repoet og er pensioneret." }
    period_start:     { DataType: NVARCHAR(50), FhirPath: "period.start", Source: [ifdb.IFDB.EVENTMARKER.TIME], Expr: "Tidligste TIME blandt patientens ikke-slettede markører", Description: "Tidspunktet på patientens første markør." }
    period_end:       { DataType: NVARCHAR(50), FhirPath: "period.end", Source: [ifdb.IFDB.EVENTMARKER.TIME], Expr: "Seneste TIME blandt patientens ikke-slettede markører", Description: "Tidspunktet på patientens seneste markør. Ikke et afslutningstidspunkt: forløbet er fortsat åbent." }
    organization_id:  { DataType: NVARCHAR(255), FhirPath: "author.getReferenceKey(Organization)", FK-Target: fhir.Organization, FK-Key: organization_id, FK-Required: false, Source: [ifdb.IFDB.EVENTMARKER.ADMINISTRATIVE_UNIT_SORCODE], Expr: "SOR-koden på patientens første markør, opløst til fhir.Organization", Description: "Reference til den administrative enhed på patientens første markør i fhir.Organization. Tom, hvis den første markør ikke har en SOR-kode, eller enheden ikke findes i fhir.Organization." }
    identifier_value: { DataType: NVARCHAR(500), FhirPath: "identifier.value.first()", Expr: "patient_id + '_alle_markoerer'", Description: "FHIR-tildelt. '<FHIR patient id>_alle_markoerer' i system urn:dk:sundhed:alle-markoerer:careplan. Noeglet paa PERSONEN, ikke paa EVENTMARKER.PATIENT_ID: IFDB pensionerer et PATIENT_ID og udsteder et nyt for samme CPR, og begge resolver til samme FHIR-patient. Et UNIQUE partielt indeks paa vaerdien goer en anden levende CarePlan pr. person uskrivelig." }
    dw_is_deleted:    { DataType: INT, Description: "Slettet-flag (0 = live, 1 = slettet). Warehouse-styret: resourcen baerer ingen urn:fhir:isDeleted-extension, og viewet projicerer ikke feltet. Saettes kun af dqa_fhir_server_cleanup og nulstilles ved MERGE-match. NOT NULL DEFAULT 0, saa konsumenter kan skrive '= 0' ensartet paa tvaers af alle fhir.*-tabeller." }
    last_updated:     { DataType: DATETIME2, FhirPath: "r.ts", Description: "FHIR-tildelt. Tidspunkt for seneste ændring af ressourcen på FHIR-serveren; ikke et tidspunkt fra kilden." }
    created_at:       { DataType: DATETIME2, FhirPath: "r.cts", Description: "FHIR-tildelt. Tidspunkt for oprettelsen af ressourcen på FHIR-serveren; ikke et tidspunkt fra kilden." }
