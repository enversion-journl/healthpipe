dso_lineage:
  Type: fact
  TableName: fct.AfdelingLagerbeholdning
  Domain: [ERP]
  Description: "Afdelingslager periodisk snapshot-fact tabel — dagligt fuldlæs fra ILS"
  Grain: "Én række pr. afdelingslager-snapshot (Dato, sgh, lgr, vnr, brik, rnr)"

  SourceSystems:
    - ils: [dbo.afdlgrbeh, dbo.vare]

  Columns:
    dw_ek_AfdelingLagerbeholdning:              { Type: PK, DataType: BIGINT }
    dw_ek_Lager:
      Type: FK
      DataType: BIGINT
      Source: [ils.dbo.afdlgrbeh.sgh, ils.dbo.afdlgrbeh.lgr]
      Description: >
        Oploeses via map.Lager paa noeglen SGH_{sgh}_LGR_{lgr}. Er lgr ikke
        oplyst, oploeses noeglen til sygehus-medlemmet SGH_{sgh}; uden sgh er
        noeglen NULL -> -1.
    dw_ek_Rekvirent:
      Type: FK
      DataType: INT
      Source: [ils.dbo.afdlgrbeh.sgh, ils.dbo.afdlgrbeh.rnr]
      Description: >
        Oploeses via map.Rekvirent paa noeglen SGH_{sgh}_RNR_{rnr}. Er rnr ikke
        oplyst, oploeses noeglen til sygehus-medlemmet SGH_{sgh}; uden sgh er
        noeglen NULL -> -1.
    dw_ek_ILSVare:                              { Type: FK, DataType: INT, Source: [ils.dbo.afdlgrbeh.vnr] }
    dw_ek_UNSPSC:
      Type: FK
      DataType: INT
      FK-Target: dim.UNSPSC
      Source: [ils.dbo.vare.unspc, ils.dbo.vare.unspsc2]
      Expr: >
        COALESCE((
          SELECT um.dw_ek_UNSPSC
          FROM [dim].[ILSVare] di
          INNER JOIN [map].[UNSPSC] um
            ON um.clean_code_UNSPSC = COALESCE(
              NULLIF(LTRIM(RTRIM(di.UNSPSC)), ''),
              CASE
                WHEN di.UNSPSC_Intern LIKE '%.0'
                THEN LEFT(
                  LTRIM(RTRIM(di.UNSPSC_Intern)),
                  LEN(LTRIM(RTRIM(di.UNSPSC_Intern))) - 2
                )
                ELSE NULLIF(LTRIM(RTRIM(di.UNSPSC_Intern)), '')
              END
            )
          WHERE di.dw_ek_ILSVare = f.dw_ek_ILSVare
        ), -1)
      Description: >
        Direkte FK på fact via map.UNSPSC; CleanCode fra dim.ILSVare UNSPSC/UNSPSC_Intern
        (unspc prioriteres over unspsc2 med '.0'-strip). Ikke via dim.ILSVare.dw_ek_UNSPSC.
    dw_ek_AfdelingLagerbeholdningEgenskaber:    { Type: FK, DataType: INT, Source: [ils.dbo.afdlgrbeh.brik] }
    dw_ek_Dato_snapshot:                        { Type: FK, DataType: INT, Source: [ils.dbo.afdlgrbeh.DW_Timestamp_Update], Description: "Snapshot-Dato = datoen for ILS-udtrækket (dw_timestamp_update fra arc-laget), ikke en kolonne fra kildesystemet." }
    dw_ek_Dato_udloeb:                          { Type: FK, DataType: INT, Source: [ils.dbo.afdlgrbeh.udlobdto] }
    dato_tid_snapshot:                            { DataType: DATETIME2, Source: [ils.dbo.afdlgrbeh.snapshot_dato] }
    dato_tid_udloeb:                              { DataType: DATETIME2, Source: [ils.dbo.afdlgrbeh.udlobdto] }
    antal:                                      { Type: Measure, DataType: DECIMAL(18,3), Source: [ils.dbo.afdlgrbeh.antal] }
    dw_is_deleted:                               { DataType: BIT, Expr: "1 når rækken forsvinder fra snapshot (blød sletning)" }

  Notes:
    - "SOR organisation for reporting: vw_fct.AfdelingLagerbeholdning.DW_EK_Organisation_Lager and DW_EK_Organisation_Rekvirent (ConceptMap via dw_ek_Lager / dw_ek_Rekvirent). fct has no dw_ek_Organisation column."
