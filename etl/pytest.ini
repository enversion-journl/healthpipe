[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add project root to Python path (package is at etl/)
pythonpath = .

# Test markers
markers =
    unit: Fast unit tests with mocked resources
    integration: Integration tests that may use real or mock resources
    real_resources: Tests that REQUIRE real data sources
    erp: ERP domain-specific tests
    patient_test: Patient-specific pipeline tests
    encounter_test: Encounter-specific pipeline tests
    episode_of_care_test: Episode of care-specific pipeline tests
    location_test: Location-specific pipeline tests
    observation_test: Observation-specific pipeline tests
    organization_test: Organization-specific pipeline tests
    structure_definition_test: Structure definition-specific pipeline tests
    slow: Longer-running tests
    read_only: Read-only tests (safe for real databases)
    performance: Performance and load testing with large datasets

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --showlocals
    -ra
    --order-dependencies

# Warnings
filterwarnings =
    ignore::UserWarning
    # Ignore Pydantic deprecation warnings from Dagster dependencies
    # This is a known issue in Dagster's dependencies and will be fixed upstream
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    # Also filter by message pattern as backup
    ignore:.*PydanticDeprecatedSince20.*:pydantic.warnings.PydanticDeprecatedSince20
    # Ignore Dagster beta warnings for observable_source_asset
    ignore::dagster.BetaWarning
