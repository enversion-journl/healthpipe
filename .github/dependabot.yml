# Dependabot — automated dependency-update PRs for the public HealthPipe repo.
#
# Complements the report-only `pip-audit` job in ci.yml: pip-audit *detects* known CVEs
# in installed deps, while Dependabot *opens PRs* that bump them. The github-actions
# ecosystem additionally keeps our SHA-pinned `uses:` refs current — otherwise the pins
# silently rot (org policy requires full-SHA pins; see ci.yml / task 28646).
#
# NOTE: GitHub-only feature. Dormant while the repo lives on Azure DevOps; activates on
# the GitHub cut-over (HealthPipe).
version: 2
updates:
  # Python deps declared in pyproject.toml ([project] + [project.optional-dependencies]).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    groups:
      # Batch the low-risk dev/test/CI tooling into one PR to cut review noise.
      dev-tooling:
        patterns:
          - "pytest*"
          - "black"
          - "ruff"
          - "isort"
          - "flake8*"
          - "mypy"
          - "pip-audit"
          - "pre-commit"

  # GitHub Actions referenced in .github/workflows/*.yml — keeps the SHA pins fresh.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
