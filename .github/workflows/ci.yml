# Continuous Integration for the public HealthPipe repo (US 28518).
#
# Jobs:
#   - lint  (REQUIRED): runs the pre-commit config (Black, Ruff, isort, flake8, file
#           hooks) on the files CHANGED in the PR / push — not the whole tree. Single
#           source of truth = .pre-commit-config.yaml. Changed-files scoping keeps the
#           gate green while still holding all new/modified code to the standard; the
#           repo-wide pre-existing formatting debt is intentionally NOT gated here.
#   - test  (REQUIRED): runs the FULL unit suite (etl/tests/unit/) on a native
#           runner, now with coverage (term-missing + coverage.xml + junit). Integration
#           / real_resources tests need a real database and are intentionally NOT run.
#   - defs-validate / typecheck (mypy) / audit (pip-audit)  (REPORT-ONLY for now,
#           task 28647): each runs with `continue-on-error: true`, so it surfaces its
#           findings (broken code location, type errors, dependency CVEs) as annotations
#           WITHOUT blocking merges while the tree/deps are brought up to standard.
#           Promote each to a REQUIRED status check once it is green (branch protection,
#           story 28519). pip-audit findings are triaged with `--ignore-vuln <id>`
#           (rationale inline) or by bumping the pin.
#
# All `uses:` are pinned to full-length commit SHAs — the org enforces "Require actions
# to be pinned to a full-length commit SHA"; tag refs (`@v4`) cause a startup failure.
# The trailing `# vN` comment records the human-readable version.
#
# No GitHub Secrets are required. The unit tests + the definitions load run with
# placeholder DB env vars and mocked resources, exactly as the former Azure DevOps test
# pipeline did. The variable groups / service connections that secrets would "replace"
# were for deployment (ACR build/push + Nomad), out of scope here (infrastructure repo).
#
# NOTE: GitHub Actions only runs on GitHub. This file is dormant while the repo lives on
# Azure DevOps and activates automatically once on GitHub (HealthPipe).

name: ci

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (pre-commit, changed files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so we can diff the PR/push against its base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit==4.3.0

      - name: Run pre-commit on changed files
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          if [ "$IS_PR" = "true" ]; then
            # PR: files changed on this branch since it diverged from the base.
            range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            # Push to an existing branch: files changed in this push.
            range="${PUSH_BEFORE}...${PUSH_AFTER}"
          else
            # New branch / no usable base: fall back to the tip commit's files.
            range="${PUSH_AFTER}^...${PUSH_AFTER}"
          fi

          echo "Diff range: $range"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$range" || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files to lint."
            exit 0
          fi
          printf 'Linting %d changed file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          # pre-commit still applies each hook's own type/exclude filters to this list,
          # so non-Python and excluded paths are skipped automatically.
          pre-commit run --files "${files[@]}" --show-diff-on-failure --color always

  test:
    name: test (pytest unit)
    runs-on: ubuntu-latest
    env:
      # Placeholder connection settings — unit tests use mocked resources and never
      # open a real connection. Mirrors the former Azure DevOps test pipeline so the
      # workflow needs no GitHub Secrets.
      MYSUPPLY_PROD_MSSQL_SERVER: placeholder
      MYSUPPLY_PROD_MSSQL_PORT: "1433"
      MYSUPPLY_PROD_MSSQL_DATABASE: placeholder
      MYSUPPLY_PROD_MSSQL_USERNAME: placeholder
      MYSUPPLY_PROD_MSSQL_PASSWORD: placeholder
      SYDAX_PROD_MSSQL_SERVER: placeholder
      SYDAX_PROD_MSSQL_PORT: "1433"
      SYDAX_PROD_MSSQL_DATABASE: placeholder
      SYDAX_PROD_MSSQL_USERNAME: placeholder
      SYDAX_PROD_MSSQL_PASSWORD: placeholder
      ILS_PROD_MSSQL_SERVER: placeholder
      ILS_PROD_MSSQL_PORT: "1433"
      ILS_PROD_MSSQL_DATABASE: placeholder
      ILS_PROD_MSSQL_USERNAME: placeholder
      ILS_PROD_MSSQL_PASSWORD: placeholder
      COSMIC_PROD_MSSQL_SERVER: placeholder
      COSMIC_PROD_MSSQL_PORT: "1433"
      COSMIC_PROD_MSSQL_DATABASE: placeholder
      COSMIC_PROD_MSSQL_USERNAME: placeholder
      COSMIC_PROD_MSSQL_PASSWORD: placeholder
      IFDB_PROD_ORACLE_SERVER: placeholder
      IFDB_PROD_ORACLE_PORT: "1521"
      IFDB_PROD_ORACLE_DATABASE: placeholder
      IFDB_PROD_ORACLE_USERNAME: placeholder
      IFDB_PROD_ORACLE_PASSWORD: placeholder
      IFDB_PROD_ORACLE_SCHEMA: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit tests with coverage
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cd etl
          python -m pytest tests/unit/ \
            --cov=. --cov-report=term-missing \
            --cov-report=xml:"$GITHUB_WORKSPACE/test-results/coverage.xml" \
            --junitxml="$GITHUB_WORKSPACE/test-results/unit.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: ignore

  defs-validate:
    name: dagster definitions validate
    runs-on: ubuntu-latest
    # REPORT-ONLY on introduction (task 28647): loading the full code location on a
    # bare runner is unverified until the first GitHub run. Promote to a required
    # check once it is confirmed green at cut-over (story 28519).
    continue-on-error: true
    env:
      # definitions.py + its packages (core, DSA, …) live under etl/, imported
      # as top-level modules, so etl must be the source root on sys.path. The
      # root pyproject's [tool.dagster] module_name = "definitions" then resolves.
      PYTHONPATH: ${{ github.workspace }}/etl
      # Same placeholder connection settings as `test` — building the Definitions object
      # must not open a real connection. No GitHub Secrets required.
      MYSUPPLY_PROD_MSSQL_SERVER: placeholder
      MYSUPPLY_PROD_MSSQL_PORT: "1433"
      MYSUPPLY_PROD_MSSQL_DATABASE: placeholder
      MYSUPPLY_PROD_MSSQL_USERNAME: placeholder
      MYSUPPLY_PROD_MSSQL_PASSWORD: placeholder
      SYDAX_PROD_MSSQL_SERVER: placeholder
      SYDAX_PROD_MSSQL_PORT: "1433"
      SYDAX_PROD_MSSQL_DATABASE: placeholder
      SYDAX_PROD_MSSQL_USERNAME: placeholder
      SYDAX_PROD_MSSQL_PASSWORD: placeholder
      ILS_PROD_MSSQL_SERVER: placeholder
      ILS_PROD_MSSQL_PORT: "1433"
      ILS_PROD_MSSQL_DATABASE: placeholder
      ILS_PROD_MSSQL_USERNAME: placeholder
      ILS_PROD_MSSQL_PASSWORD: placeholder
      COSMIC_PROD_MSSQL_SERVER: placeholder
      COSMIC_PROD_MSSQL_PORT: "1433"
      COSMIC_PROD_MSSQL_DATABASE: placeholder
      COSMIC_PROD_MSSQL_USERNAME: placeholder
      COSMIC_PROD_MSSQL_PASSWORD: placeholder
      IFDB_PROD_ORACLE_SERVER: placeholder
      IFDB_PROD_ORACLE_PORT: "1521"
      IFDB_PROD_ORACLE_DATABASE: placeholder
      IFDB_PROD_ORACLE_USERNAME: placeholder
      IFDB_PROD_ORACLE_PASSWORD: placeholder
      IFDB_PROD_ORACLE_SCHEMA: placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate the Dagster code location loads
        run: dagster definitions validate

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    # REPORT-ONLY (task 28647): the existing tree is largely untyped, so mypy will
    # surface many findings. Surface them as annotations now; promote to required once
    # the tree is mypy-clean. Config + lenient defaults live in [tool.mypy] (pyproject).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run mypy
        run: mypy etl

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # REPORT-ONLY (task 28647): pip-audit gates the full installed dependency tree
    # against the PyPI advisory DB. The real tree will surface CVEs that need triage —
    # accept each with `--ignore-vuln <id>` + rationale, or bump the pin — then promote
    # this to a required check.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Audit installed dependencies for known CVEs
        run: pip-audit --desc

  license-headers:
    name: SPDX license headers (full tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify every file carries an SPDX header
        run: python etl/scripts/license_headers.py --check
