# Continuous Integration for the public HealthPipe repo.
#
# Jobs:
#   - lint  (REQUIRED): runs the pre-commit config (Black, Ruff, Bandit, file hooks)
#           on the files CHANGED in the PR / push — not the whole tree. Single
#           source of truth = .pre-commit-config.yaml.
#   - test  (REQUIRED): runs the FULL unit suite (etl/tests/unit/) on a native
#           runner, now with coverage (term-missing + coverage.xml + junit). Integration
#           / real_resources tests need a real database and are intentionally NOT run.
#   - defs-validate (REQUIRED): loads the full Dagster code location.
#   - typecheck (mypy) (REQUIRED): `mypy --strict etl/utils`. The full-tree mypy step is
#           REPORT-ONLY (`continue-on-error: true`).
#   - audit (pip-audit) (REPORT-ONLY): runs with `continue-on-error: true`. Findings are
#           triaged with `--ignore-vuln <id>` (rationale inline) or by bumping the pin.
#
# All `uses:` are pinned to full-length commit SHAs — the org enforces "Require actions
# to be pinned to a full-length commit SHA"; tag refs (`@v4`) cause a startup failure.
# The trailing `# vN` comment records the human-readable version.
#
# No GitHub Secrets are required. The unit tests + the definitions load run with
# placeholder DB env vars (workflow-level `env` below) and mocked resources. Deployment
# (image build/push + rollout) is out of scope here.

name: ci

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholder connection settings — unit tests and the definitions load use mocked
# resources and never open a real connection, so no GitHub Secrets are needed.
env:
  MYSUPPLY_PROD_MSSQL_SERVER: placeholder
  MYSUPPLY_PROD_MSSQL_PORT: "1433"
  MYSUPPLY_PROD_MSSQL_DATABASE: placeholder
  MYSUPPLY_PROD_MSSQL_USERNAME: placeholder
  MYSUPPLY_PROD_MSSQL_PASSWORD: placeholder
  SYDAX_PROD_MSSQL_SERVER: placeholder
  SYDAX_PROD_MSSQL_PORT: "1433"
  SYDAX_PROD_MSSQL_DATABASE: placeholder
  SYDAX_PROD_MSSQL_USERNAME: placeholder
  SYDAX_PROD_MSSQL_PASSWORD: placeholder
  SYDAX_PROD_MSSQL_SCHEMA_FINANS: placeholder
  SYDAX_PROD_MSSQL_SCHEMA_KREDITOR: placeholder
  ILS_PROD_MSSQL_SERVER: placeholder
  ILS_PROD_MSSQL_PORT: "1433"
  ILS_PROD_MSSQL_DATABASE: placeholder
  ILS_PROD_MSSQL_USERNAME: placeholder
  ILS_PROD_MSSQL_PASSWORD: placeholder
  COSMIC_PROD_MSSQL_SERVER: placeholder
  COSMIC_PROD_MSSQL_PORT: "1433"
  COSMIC_PROD_MSSQL_DATABASE: placeholder
  COSMIC_PROD_MSSQL_USERNAME: placeholder
  COSMIC_PROD_MSSQL_PASSWORD: placeholder
  IFDB_PROD_ORACLE_SERVER: placeholder
  IFDB_PROD_ORACLE_PORT: "1521"
  IFDB_PROD_ORACLE_DATABASE: placeholder
  IFDB_PROD_ORACLE_USERNAME: placeholder
  IFDB_PROD_ORACLE_PASSWORD: placeholder
  IFDB_PROD_ORACLE_SCHEMA: placeholder

jobs:
  lint:
    name: lint (pre-commit, changed files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so we can diff the PR/push against its base.
          fetch-depth: 0

      - name: Set up Python, uv and the dev extra
        uses: ./.github/actions/setup

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit on changed files
        env:
          SKIP: gitleaks
          IS_PR: ${{ github.event_name == 'pull_request' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          if [ "$IS_PR" = "true" ]; then
            # PR: files changed on this branch since it diverged from the base.
            range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$ZERO" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            # Push to an existing branch: files changed in this push.
            range="${PUSH_BEFORE}...${PUSH_AFTER}"
          else
            # New branch / no usable base: fall back to the tip commit's files.
            range="${PUSH_AFTER}^...${PUSH_AFTER}"
          fi

          echo "Diff range: $range"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$range" || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files to lint."
            exit 0
          fi
          printf 'Linting %d changed file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          # pre-commit still applies each hook's own type/exclude filters to this list,
          # so non-Python and excluded paths are skipped automatically.
          pre-commit run --files "${files[@]}" --show-diff-on-failure --color always

  test:
    name: test (pytest unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python, uv and the dev extra
        uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cd etl
          python -m pytest tests/unit/ \
            --cov=. --cov-report=term-missing \
            --cov-report=xml:"$GITHUB_WORKSPACE/test-results/coverage.xml" \
            --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY" \
            --junitxml="$GITHUB_WORKSPACE/test-results/unit.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: ignore

  defs-validate:
    name: dagster definitions validate
    runs-on: ubuntu-latest
    env:
      # definitions.py + its packages (core, DSA, …) live under etl/, imported
      # as top-level modules, so etl must be the source root on sys.path. The
      # root pyproject's [tool.dagster] module_name = "definitions" then resolves.
      PYTHONPATH: ${{ github.workspace }}/etl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python, uv and the dev extra
        uses: ./.github/actions/setup

      - name: Validate the Dagster code location loads
        run: dagster definitions validate

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    # REQUIRED for etl/utils, which passes `mypy --strict`. The rest of the tree is
    # REPORT-ONLY: the full-tree step has `continue-on-error`, so its findings show as
    # annotations and do not block merges. Config + lenient defaults live in [tool.mypy]
    # (pyproject).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python, uv and the dev extra
        uses: ./.github/actions/setup

      - name: Run mypy --strict on etl/utils
        run: mypy --strict etl/utils

      - name: Run mypy
        continue-on-error: true
        run: mypy etl

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # REPORT-ONLY: pip-audit checks the full installed dependency tree against the PyPI
    # advisory DB. Accept a finding with `--ignore-vuln <id>` + rationale, or bump the pin.
    # The ignored advisories affect black, which the source pins at 25.9.0:
    #   - PYSEC-2026-2120, CVE-2026-114134: the black GitHub Action with `use_pyproject`,
    #     which this repo does not use.
    #   - PYSEC-2026-2121: needs an untrusted `--python-cell-magics` value, which CI never
    #     passes.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python, uv and the dev extra
        uses: ./.github/actions/setup

      - name: Audit installed dependencies for known CVEs
        run: pip-audit --desc --ignore-vuln PYSEC-2026-2120 --ignore-vuln PYSEC-2026-2121 --ignore-vuln CVE-2026-114134

  license-headers:
    name: SPDX license headers (full tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python, uv and the dev extra
        uses: ./.github/actions/setup

      - name: Verify every file carries an SPDX header
        run: python etl/scripts/license_headers.py --check
