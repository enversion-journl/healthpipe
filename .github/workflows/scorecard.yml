# OpenSSF Scorecard — supply-chain security posture for the public HealthPipe repo.
#
# Scores the repo against OpenSSF best practices (branch protection, pinned dependencies,
# token permissions, dangerous-workflow patterns, …) and uploads results to Security ->
# Code scanning. `publish_results: true` also feeds the public Scorecard API/badge.
#
# Some checks need the default branch, so this runs on a schedule + push to the default
# branch (`main`) rather than on PRs. All `uses:` are SHA-pinned (org policy).
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 4 * * 1" # weekly, Mondays 04:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    if: vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3
        with:
          sarif_file: results.sarif
