# OpenSSF Scorecard — supply-chain security posture for the public HealthPipe repo.
#
# Scores the repo against OpenSSF best practices (branch protection, pinned dependencies,
# token permissions, dangerous-workflow patterns, …) and uploads results to Security ->
# Code scanning. `publish_results: true` also feeds the public Scorecard API/badge.
#
# Some checks need the default branch, so this runs on a schedule + push to the default
# branch (`main` after cut-over) rather than on PRs. All `uses:` are SHA-pinned (org
# policy). Dormant while the repo lives on Azure DevOps; activates on the GitHub cut-over.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 4 * * 1" # weekly, Mondays 04:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: results.sarif
