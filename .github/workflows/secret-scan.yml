# Secret + PII scan (server-side gate) for the public HealthPipe repo.
#
# This complements the local pre-commit gitleaks hook: a local hook is advisory
# and bypassable (`git commit --no-verify`, or never installed), whereas this
# job runs on GitHub and CANNOT be bypassed once required via branch protection.
#
# It reuses the SAME .gitleaks.toml as the pre-commit hook, so the secret/token
# rules and the custom PII rules (Danish CPR, email, +45 phone, names) are
# identical on both sides.
#
# To make it BLOCK merges, add it as a required status check in branch protection.

name: secret-scan

on:
  pull_request:
  push:
    branches: [main, development]
  schedule:
    - cron: "0 4 * * 1" # weekly full-history sweep, Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secrets + PII)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1" # keep in sync with .devcontainer/startup_scripts/setup-precommit.sh
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$asset" checksums.txt gitleaks
          gitleaks version

      - name: Scan for secrets and PII
        run: |
          gitleaks git . \
            --no-banner \
            --redact \
            --config .gitleaks.toml \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-results.sarif

      - name: Upload findings report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          if-no-files-found: ignore
