# Dependency review for the public HealthPipe repo.
#
# Runs on pull requests: inspects the dependency-manifest changes (pyproject.toml) and
# BLOCKS the PR if it introduces a dependency with a known high/critical vulnerability.
# PR-time complement to the report-only `pip-audit` job, which scans what is already
# merged. Requires GitHub's Dependency Graph (on by default for public repos).
#
# All `uses:` are SHA-pinned (org policy).
name: dependency-review

on:
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  pull-requests: write # for comment-summary-in-pr

jobs:
  dependency-review:
    name: dependency review
    if: vars.CODE_SCANNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
