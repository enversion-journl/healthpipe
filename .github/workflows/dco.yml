# DCO — every non-merge commit in a PR must carry a `Signed-off-by:` trailer
# (`git commit -s`), as CONTRIBUTING.md requires.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $(git show -s --format='%h %s' "$sha") has no Signed-off-by trailer."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the sign-off with 'git commit --amend -s --no-edit' or"
            echo "'git rebase --signoff ${BASE_SHA}', then force-push. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
