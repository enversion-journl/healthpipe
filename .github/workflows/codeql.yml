# CodeQL static analysis (SAST) for the public HealthPipe repo.
#
# Completes the security triad: gitleaks (secret-scan.yml) covers secrets/PII, pip-audit
# (ci.yml) covers known-CVE dependencies, and CodeQL covers CODE-level flaws (injection,
# unsafe deserialization, path traversal, …). Findings land in Security -> Code scanning;
# make them blocking by requiring the check via branch protection.
#
# Python only — the codebase is pure Python (requires-python == 3.12.*) with no compiled
# build step, so CodeQL's `build-mode: none` applies.
#
# All `uses:` are SHA-pinned (org policy).
name: codeql

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: "0 4 * * 1" # weekly, Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          category: "/language:python"
