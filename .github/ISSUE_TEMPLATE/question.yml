name: Question
description: Ask a question about the use, the architecture or the contribution process
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Do not put credentials or personal data in a question. Report a security issue privately, as `SECURITY.md` describes.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What did you try, and which documents did you read?
    validations:
      required: false
