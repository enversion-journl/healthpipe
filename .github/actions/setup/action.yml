name: setup
description: Set up Python 3.12 and uv, then install the locked project with the dev extra.
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version-file: uv.lock
        enable-cache: true
        cache-dependency-glob: uv.lock
        activate-environment: true

    - name: Install the locked project with the dev extra
      shell: bash
      run: uv sync --locked --extra dev
