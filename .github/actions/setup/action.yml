name: setup
description: Set up Python 3.12 and uv, then install the locked project with the dev extra.
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version-file: uv.lock
        enable-cache: true
        cache-dependency-glob: uv.lock
        activate-environment: true

    - name: Install the locked project with the dev extra
      shell: bash
      run: uv sync --locked --extra dev
